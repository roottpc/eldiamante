<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#04070b;--panel:#0a1017;--ink:#e9f6ff;--muted:#7d91a4;--line:rgba(0,200,255,.16);--line-2:rgba(0,200,255,.38);--soft:#0e1620;--agua:#00c8ff;--agua-soft:rgba(0,200,255,.10);--on:#00121b;
  --ok:#3dffa8;--ok-soft:rgba(61,255,168,.10);--bad:#ff5472;--bad-soft:rgba(255,84,114,.12);
  --glow:0 0 0 1px rgba(0,200,255,.55),0 0 18px rgba(0,200,255,.35),0 0 42px rgba(0,200,255,.12);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--body:var(--display);--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg) radial-gradient(120% 60% at 50% -10%,rgba(0,200,255,.12),transparent 60%) no-repeat;color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:32px 20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800}
.head{display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--agua);color:var(--agua);box-shadow:var(--glow);display:grid;place-items:center;font:800 22px var(--display);flex:none;text-shadow:0 0 10px rgba(0,200,255,.8)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.step+.step{border-top:1px solid var(--line);padding-top:14px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--agua);font:600 22px var(--body);cursor:pointer}
.ctl output{font:700 26px var(--mono);min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:16px var(--body)}
.inp:focus{outline:0;border-color:var(--agua);box-shadow:0 0 0 3px rgba(0,200,255,.15),0 0 16px rgba(0,200,255,.25)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px}
.days button{border:1px solid transparent;background:none;color:var(--muted);border-radius:11px;padding:11px 4px;font:600 14px var(--body);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--agua-soft);color:var(--agua);border-color:var(--agua);box-shadow:0 0 14px rgba(0,200,255,.3)}
.btn{border:0;border-radius:16px;padding:17px;background:var(--agua);color:var(--on);font:800 16px var(--body);width:100%;cursor:pointer;box-shadow:0 0 22px rgba(0,200,255,.45),0 0 60px rgba(0,200,255,.15)}
.btn:disabled{opacity:.3;box-shadow:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:14px}
.tot strong{font:700 28px var(--mono);color:var(--agua);text-shadow:0 0 16px rgba(0,200,255,.55)}
.msg{border-radius:14px;padding:14px;font-weight:600;border:1px solid currentColor}
.ok{background:var(--ok-soft);color:var(--ok)} .err{background:var(--bad-soft);color:var(--bad)}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}

/* logo con brillo neón y destellos */
.hero{position:relative;display:grid;place-items:center;padding:18px 26px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:8% 12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,200,255,.30),rgba(0,200,255,.08) 60%,transparent);filter:blur(10px);z-index:-1;animation:halo 4s ease-in-out infinite}
.hero img{display:block;width:var(--w,220px);max-width:100%;height:auto;filter:drop-shadow(0 0 6px rgba(0,200,255,.55)) drop-shadow(0 0 22px rgba(0,200,255,.28));animation:respira 4s ease-in-out infinite}
.chispa{position:absolute;width:var(--s,14px);height:var(--s,14px);background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 4px #00c8ff) drop-shadow(0 0 10px #00c8ff);opacity:0;transform:scale(.2);animation:chispa 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes chispa{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9;transform:scale(.8) rotate(60deg)}}
@keyframes respira{0%,100%{filter:drop-shadow(0 0 6px rgba(0,200,255,.5)) drop-shadow(0 0 18px rgba(0,200,255,.22))}50%{filter:drop-shadow(0 0 10px rgba(0,200,255,.85)) drop-shadow(0 0 34px rgba(0,200,255,.45))}}
@keyframes halo{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.hero img,.hero::before{animation:none}.chispa{animation:none;opacity:.8;transform:scale(.7)}}
.logo.img{border:0;box-shadow:none;background:none;padding:0;width:40px;height:40px}
.logo.img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px rgba(0,200,255,.7))}

.hero{margin:-8px auto -4px}
.titulo{text-align:center;display:flex;flex-direction:column;gap:4px}
.titulo h1{font-size:28px;background:linear-gradient(90deg,#e9f6ff,#7fe3ff 50%,#e9f6ff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:brillo-txt 6s linear infinite}
@keyframes brillo-txt{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.titulo h1{animation:none}}
</style>
</head>

    <div class="hero" style="--w:210px"><img src="${LOGO_FULL}" alt="Purificadora El Diamante">${CHISPAS}</div>
    <div class="titulo"><h1>Haz tu pedido</h1>
    ${c ? `<p class="muted" style="margin:0">Hola, <b style="color:var(--ink)">${esc(nice(c.nombre))}</b>. Dinos cuánto necesitas y te lo llevamos.</p>` : '<p class="muted" style="margin:0">Agua purificada a tu puerta. Dinos cuánto necesitas y a dónde.</p>'}</div>
    <div class="card">
      <div class="step"><div><b>Garrafón 20 L</b><br><span class="muted">${money(I.precios.GARRAFON)} c/u</span></div><div class="ctl"><button data-p="g" data-d="-1" aria-label="Menos garrafones">−</button><output>${S.g}</output><button data-p="g" data-d="1" aria-label="Más garrafones">+</button></div></div>
      <div class="step"><div><b>Galón</b><br><span class="muted">${money(I.precios.GALON)} c/u</span></div><div class="ctl"><button data-p="gl" data-d="-1" aria-label="Menos galones">−</button><output>${S.gl}</output><button data-p="gl" data-d="1" aria-label="Más galones">+</button></div></div>
      <div class="tot"><span class="muted">Total aproximado</span><strong>${money(total)}</strong></div>
    </div>
    <div class="card"><b>¿Cuándo lo quieres?</b>
      <div class="days">${dias.map((k, i) => `<button data-dia="${k}" aria-pressed="${S.dia === k}">${etiqueta(k, i)}</button>`).join('')}</div>
      ${c ? '' : `<label>Nombre o negocio<input class="inp" id="nombre" autocomplete="name"></label>
      <label>Teléfono (WhatsApp)<input class="inp" id="tel" inputmode="tel" autocomplete="tel"></label>
      <label>Dirección de entrega<input class="inp" id="dir" autocomplete="street-address"></label>`}
      <label>Notas (opcional)<input class="inp" id="notas" placeholder="Ej. entregar antes de las 11"></label>
    </div>
    <div id="msg"></div>
    <button class="btn" id="enviar" ${S.g + S.gl === 0 ? 'disabled' : ''}>Enviar pedido</button>
    <p class="muted" style="margin:0;font-size:13px;text-align:center">Pagas al recibir. Te confirmamos por WhatsApp.</p>`;
  const keep = {};
  ['nombre', 'tel', 'dir', 'notas'].forEach(k => { if (S[k] !== undefined && $('#' + k)) $('#' + k).value = S[k]; });
  document.querySelectorAll('.inp').forEach(i => i.oninput = () => { S[i.id] = i.value; });
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) { S[b.dataset.p] = Math.max(0, S[b.dataset.p] + Number(b.dataset.d)); render(); }
  if (b.dataset.dia) { S.dia = b.dataset.dia; render(); }
  if (b.id === 'enviar') enviar();
});

function enviar() {
  const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
  const data = { idCliente: CLIENTE_ID, garrafones: S.g, galones: S.gl, fechaEntrega: S.dia, notas: S.notas || '', nombre: S.nombre || '', telefono: S.tel || '', direccion: S.dir || '' };
  google.script.run.withSuccessHandler(r => {
    $('#w').innerHTML = `<div class="hero" style="--w:170px"><img src="${LOGO_FULL}" alt="Purificadora El Diamante">${CHISPAS}</div><div class="titulo"><h1>¡Pedido recibido!</h1></div>
      <div class="msg ok">${S.g ? S.g + (S.g === 1 ? ' garrafón' : ' garrafones') : ''}${S.g && S.gl ? ' y ' : ''}${S.gl ? S.gl + (S.gl === 1 ? ' galón' : ' galones') : ''} para el ${r.entrega.split('-').reverse().join('/')}. Te confirmamos por WhatsApp.</div>
      <button class="btn" onclick="location.reload()">Hacer otro pedido</button>`;
  }).withFailureHandler(err => {
    $('#msg').innerHTML = `<div class="msg err">${esc(String(err && err.message || err).replace(/^Error:\s*/, ''))}</div>`;
    b.disabled = false; b.textContent = 'Enviar pedido';
  }).pubPedido(data);
}

google.script.run.withSuccessHandler(info => { S.info = info; render(); })
  .withFailureHandler(() => { $('#w').innerHTML = '<div class="msg err">No pudimos cargar la página. Intenta de nuevo en un momento.</div>'; })
  .pubPedidoInfo(CLIENTE_ID);
</script>
</body>
</html>
