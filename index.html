<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Diamante">
<title>El Diamante</title>
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbx_myB0-tQoGIjrci5SZh-UAH_F97YgiN--v5nDSFIBrGupZ5LPpLJfTLWLfvLtKxSw4Q/exec";</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Tablero oscuro: negro profundo, líneas finas azul neón, brillo solo en lo principal y lo seleccionado */
:root{
  --bg:#04070b; --panel:#0a1017; --ink:#e9f6ff; --muted:#7d91a4; --line:rgba(0,200,255,.16); --line-2:rgba(0,200,255,.38); --soft:#0e1620;
  --agua:#00c8ff; --agua-soft:rgba(0,200,255,.10); --on:#00121b;
  --ok:#3dffa8; --ok-soft:rgba(61,255,168,.10); --warn:#ffc247; --warn-soft:rgba(255,194,71,.10); --bad:#ff5472; --bad-soft:rgba(255,84,114,.12);
  --v1:#00c8ff; --v2:#ff4fd8; --v3:#7cff6b; --v4:#ffb800;
  --glow:0 0 0 1px rgba(0,200,255,.55),0 0 18px rgba(0,200,255,.35),0 0 42px rgba(0,200,255,.12);
  --r:18px;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --body:var(--display);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg) radial-gradient(120% 60% at 50% -10%,rgba(0,200,255,.10),transparent 60%) no-repeat;color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.02em}
h1{font-size:26px;font-weight:800} h2{font-size:20px;font-weight:700} h3{font-size:15px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
button:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.app.wide{max-width:1120px}
.top{position:sticky;top:0;z-index:5;background:rgba(4,7,11,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:16px 20px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top .back{border:1px solid var(--line-2);background:transparent;width:38px;height:38px;border-radius:50%;font:600 22px/1 var(--body);color:var(--agua);display:grid;place-items:center;padding:0 0 3px}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:38px;height:38px;border-radius:12px;background:transparent;border:1.5px solid var(--agua);color:var(--agua);box-shadow:var(--glow);display:grid;place-items:center;font:800 17px var(--display);flex:none;text-shadow:0 0 10px rgba(0,200,255,.8)}
main{flex:1;padding:16px 20px 110px;display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav div{display:flex;max-width:528px;width:100%;background:rgba(10,16,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:22px;padding:6px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px rgba(0,200,255,.08)}
.nav button{flex:1;border:0;background:none;padding:8px 2px;border-radius:16px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button[aria-current="page"]{color:var(--agua);background:var(--agua-soft);text-shadow:0 0 8px rgba(0,200,255,.6)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(0,200,255,.8))}
.nav svg{width:21px;height:21px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kp span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kp b{font:700 24px var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;margin-top:4px;color:var(--ink)}
.kp>div:first-child b{color:var(--agua);text-shadow:0 0 14px rgba(0,200,255,.55)}
.kp small{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:1px solid var(--agua);border-radius:var(--r);padding:18px 14px;background:linear-gradient(160deg,rgba(0,200,255,.16),rgba(0,200,255,.03));color:var(--ink);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;box-shadow:var(--glow);min-height:96px}
.big.alt{background:var(--panel);border-color:var(--line);box-shadow:none}
.big.alt:hover{border-color:var(--line-2)}
.big svg{width:22px;height:22px;padding:8px;box-sizing:content-box;border-radius:12px;color:var(--agua);background:var(--agua-soft);filter:drop-shadow(0 0 6px rgba(0,200,255,.6))}
.big.alt svg{filter:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;text-align:left;color:var(--ink)}
button.row{cursor:pointer}
button.row:hover{border-color:var(--line-2)}
.row .who{min-width:0;flex:1}
.row b{display:block;font-size:14px;font-weight:600}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--agua-soft);color:var(--agua)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--agua);opacity:.8;margin-top:6px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:0;border-color:var(--agua);box-shadow:0 0 0 3px rgba(0,200,255,.15),0 0 16px rgba(0,200,255,.25)}
select.inp option{background:var(--panel)}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.step+.step{border-top:1px solid var(--line);padding-top:12px}
.step .ctl{display:flex;align-items:center;gap:6px}
.step .ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:transparent;color:var(--agua);font:600 20px var(--body)}
.step .ctl input{width:54px;text-align:center;font:700 20px var(--mono);border:0;border-radius:12px;background:transparent;padding:6px 2px;font-variant-numeric:tabular-nums;color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:1px solid transparent;border-radius:11px;padding:10px 2px;font-weight:600;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--agua-soft);color:var(--agua);border-color:var(--agua);box-shadow:0 0 14px rgba(0,200,255,.3);text-shadow:0 0 8px rgba(0,200,255,.5)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums;gap:8px}
.tot b{font-family:var(--mono);font-weight:700}
.tot strong{font:700 28px var(--mono);letter-spacing:-.03em;color:var(--agua);text-shadow:0 0 16px rgba(0,200,255,.55)}
.btn{border:0;border-radius:16px;padding:16px;background:var(--agua);color:var(--on);font-weight:800;font-size:15px;width:100%;box-shadow:0 0 22px rgba(0,200,255,.45),0 0 60px rgba(0,200,255,.15)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.small{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.3;box-shadow:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.warnbox,.badbox,.okbox{border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;border:1px solid currentColor}
.warnbox{background:var(--warn-soft);color:var(--warn)} .badbox{background:var(--bad-soft);color:var(--bad)} .okbox{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
.toast{position:fixed;left:20px;right:20px;bottom:96px;max-width:520px;margin:0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--agua);border-radius:16px;padding:14px 16px;font-weight:600;font-size:14px;box-shadow:var(--glow);transform:translateY(20px);opacity:0;transition:transform .25s,opacity .25s;z-index:10;pointer-events:none;visibility:hidden}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast.err{border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 1px rgba(255,84,114,.5),0 0 20px rgba(255,84,114,.3)}
.loading{position:fixed;inset:0;background:rgba(4,7,11,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20}
.loading div{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:14px 20px;font-weight:600;display:flex;align-items:center;gap:10px}
.loading div::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--agua);box-shadow:0 0 10px rgba(0,200,255,.5);animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.trip{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.trip::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.trip a.btn{background:transparent!important;color:var(--c);border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.num{width:28px;height:28px;border-radius:50%;border:1px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 13px var(--mono);flex:none;box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
.trip .row{background:var(--soft)}
.search{position:sticky;top:70px;z-index:4}
.tw{overflow-x:auto;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n{font-family:var(--mono)}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--agua);background:var(--panel);position:sticky;top:0}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--agua);color:var(--agua);background:var(--agua-soft);box-shadow:0 0 14px rgba(0,200,255,.3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pgrid .card{gap:4px}
.pgrid .card b{font-family:var(--mono)!important;letter-spacing:-.03em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cols>*{min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--mono)}
.chart rect{filter:drop-shadow(0 0 4px rgba(0,200,255,.55))}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbar b{font-family:var(--mono)}
.hbar i{display:block;height:6px;border-radius:3px;background:var(--agua);box-shadow:0 0 10px rgba(0,200,255,.6)}
textarea.inp{min-height:280px;font:13px/1.6 var(--mono)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.login .logo{width:72px!important;height:72px!important;font-size:34px!important;border-radius:20px!important}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:8px}
.pinpad button{height:76px;border-radius:50%;border:1px solid var(--line-2);background:rgba(10,16,23,.7);font:500 24px var(--mono);color:var(--ink)}
.pinpad button:active{border-color:var(--agua);box-shadow:var(--glow);color:var(--agua)}
.dots{display:flex;gap:12px;height:14px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line-2);transition:all .15s}
.dots i.on{background:var(--agua);border-color:var(--agua);box-shadow:0 0 10px rgba(0,200,255,.9)}


.mapa{position:relative;width:100%;aspect-ratio:2/1;overflow:hidden;border-radius:14px;border:1px solid var(--line-2);background:#0a1620}
.mapa .tiles{position:absolute;inset:0;filter:invert(1) hue-rotate(185deg) brightness(.78) contrast(.95) saturate(.55)}
.mapa .tiles img{position:absolute;max-width:none;user-select:none;pointer-events:none}
.mapa svg{position:absolute;inset:0;width:100%;height:100%}
.mapa .attr{position:absolute;right:4px;bottom:2px;font-size:9px;color:rgba(255,255,255,.55)}
.mapa .ley{position:absolute;left:8px;top:6px;display:flex;gap:6px;flex-wrap:wrap}
.mapa .ley span{font:600 10.5px var(--body);padding:2px 7px;border-radius:99px;background:rgba(3,8,12,.8);border:1px solid currentColor}

.vv{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.vv .g{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.vv .bars{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:104px;width:100%;border-bottom:1px solid var(--line-2)}
.vv .b{width:24px;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.vv .b span{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font:700 12.5px var(--mono,ui-monospace,monospace);color:var(--ink);font-variant-numeric:tabular-nums}
.vv .g b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vvley{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.vvley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* avisos */
.bell{position:relative;border:1px solid var(--line-2);background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--agua);flex:none}
.bell svg{width:20px;height:20px}
.bell .cnt{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:800 11px/20px var(--body);text-align:center;box-shadow:0 0 12px rgba(255,84,114,.9)}
.bell.hay{border-color:var(--bad);color:var(--bad);animation:campana 1.2s ease-in-out infinite}
@keyframes campana{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-6deg)}}
.alerta{position:fixed;left:12px;right:12px;top:calc(80px + env(safe-area-inset-top,0px));z-index:30;max-width:540px;margin:0 auto;background:rgba(40,8,16,.96);border:1.5px solid var(--bad);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;color:var(--ink);box-shadow:0 0 0 1px rgba(255,84,114,.6),0 0 24px rgba(255,84,114,.55),0 0 60px rgba(255,84,114,.25);animation:latido 1.1s ease-in-out infinite;cursor:pointer;text-align:left;width:auto}
.alerta.info{background:rgba(4,24,34,.96);border-color:var(--agua);box-shadow:var(--glow);animation:latidoAzul 1.4s ease-in-out infinite}
.alerta b{display:block;font-size:14px}
.alerta small{display:block;color:var(--muted);font-size:12px}
.alerta .x{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px;border:1px solid var(--line-2)}
.alerta .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,84,114,.15);color:var(--bad);flex:none}
.alerta.info .ico{background:var(--agua-soft);color:var(--agua)}
@keyframes latido{0%,100%{box-shadow:0 0 0 1px rgba(255,84,114,.6),0 0 18px rgba(255,84,114,.45)}50%{box-shadow:0 0 0 2px rgba(255,84,114,.9),0 0 36px rgba(255,84,114,.8),0 0 80px rgba(255,84,114,.35)}}
@keyframes latidoAzul{0%,100%{box-shadow:0 0 0 1px rgba(0,200,255,.5),0 0 16px rgba(0,200,255,.35)}50%{box-shadow:0 0 0 2px rgba(0,200,255,.9),0 0 34px rgba(0,200,255,.7)}}
.aviso{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.aviso.nuevo{border-color:var(--agua);box-shadow:0 0 16px rgba(0,200,255,.25)}
.aviso.URGENTE{border-color:var(--bad);box-shadow:0 0 18px rgba(255,84,114,.3)}
.aviso.ATENDIDO{opacity:.55}
.aviso p{margin:0;font-size:15px;line-height:1.45}
.aviso .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.t-URGENTE{background:var(--bad-soft);color:var(--bad)} .t-PROBLEMA{background:var(--warn-soft);color:var(--warn)} .t-SOLICITUD{background:var(--agua-soft);color:var(--agua)} .t-INDICACION{background:rgba(124,255,107,.1);color:#7cff6b}
.plantillas{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.bell.hay,.alerta{animation:none}}

/* logo con brillo neón y destellos */
.hero{position:relative;display:grid;place-items:center;padding:18px 26px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:8% 12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,200,255,.30),rgba(0,200,255,.08) 60%,transparent);filter:blur(10px);z-index:-1;animation:halo 4s ease-in-out infinite}
.hero img{display:block;width:var(--w,220px);max-width:100%;height:auto;filter:drop-shadow(0 0 6px rgba(0,200,255,.55)) drop-shadow(0 0 22px rgba(0,200,255,.28));animation:respira 4s ease-in-out infinite}
.chispa{position:absolute;width:var(--s,14px);height:var(--s,14px);background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 4px #00c8ff) drop-shadow(0 0 10px #00c8ff);opacity:0;transform:scale(.2);animation:chispa 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes chispa{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9;transform:scale(.8) rotate(60deg)}}
@keyframes respira{0%,100%{filter:drop-shadow(0 0 6px rgba(0,200,255,.5)) drop-shadow(0 0 18px rgba(0,200,255,.22))}50%{filter:drop-shadow(0 0 10px rgba(0,200,255,.85)) drop-shadow(0 0 34px rgba(0,200,255,.45))}}
@keyframes halo{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.hero img,.hero::before{animation:none}.chispa{animation:none;opacity:.8;transform:scale(.7)}}
.logo.img{border:0;box-shadow:none;background:none;padding:0;width:40px;height:40px}
.logo.img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px rgba(0,200,255,.7))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- ticket ---- */

/* ubicación del celular */
const UB = { pos: null, err: null, t: 0 };
function pedirUbicacion(maxEdad) {
  return new Promise((ok, fail) => {
    if (UB.pos && Date.now() - UB.t < (maxEdad == null ? 60000 : maxEdad)) return ok(UB.pos);
    if (!navigator.geolocation) { UB.err = 'Este celular no deja leer la ubicación.'; return fail(new Error(UB.err)); }
    navigator.geolocation.getCurrentPosition(p => {
      UB.pos = { lat: p.coords.latitude, lon: p.coords.longitude, precision: Math.round(p.coords.accuracy) }; UB.t = Date.now(); UB.err = null; ok(UB.pos);
    }, e => {
      UB.err = e.code === 1 ? 'Permiso de ubicación negado. Actívalo en el candado junto a la dirección o en Ajustes del celular.'
        : e.code === 3 ? 'La ubicación tardó demasiado. Intenta otra vez.' : 'No se pudo leer la ubicación. Revisa que el GPS esté encendido.';
      fail(new Error(UB.err));
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: Math.min(maxEdad == null ? 60000 : maxEdad, 15000) });
  });
}

/* En Apps Script se usa google.script.run; en la app instalable se habla con el servidor por internet (API_URL). */
const EN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function call(fn, ...args) {
  const falla = (e, fail) => {
    const m = (e && e.message) || String(e);
    if (m.indexOf('SESION') >= 0) { salir(true); fail(new Error('Tu sesión terminó. Vuelve a entrar.')); return; }
    fail(new Error(m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
  };
  if (!EN_GAS) {
    return new Promise((ok, fail) => {
      fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(r => r.text()).then(t => {
          let j = null; try { j = JSON.parse(t); } catch (e) {}
          if (!j) { fail(new Error(/doPost|no se encontr|not found/i.test(t) ? 'El servidor todavía no tiene la versión nueva: pega el Code.gs nuevo en Apps Script y crea una Nueva versión de la implementación.' : /accounts\.google|ServiceLogin|iniciar sesi/i.test(t) ? 'La implementación pide cuenta de Google. En Apps Script cambia el acceso a "Cualquier persona".' : 'El servidor respondió algo inesperado. Revisa que la implementación esté actualizada.')); return; }
          if (j.ok) ok(j.r); else falla(new Error(j.error || 'Error del servidor'), fail);
        })
        .catch(() => { const er = new Error(navigator.onLine === false ? 'Sin internet. Revisa tu señal e intenta de nuevo.' : 'No se pudo hablar con el servidor. Si es la primera vez, falta pegar el Code.gs nuevo en Apps Script y crear una Nueva versión con acceso para "Cualquier persona".'); er.offline = true; fail(er); });
    });
  }
  return new Promise((ok, fail) => {
    google.script.run.withSuccessHandler(ok).withFailureHandler(e => falla(e, fail))[fn](...args);
  });
}
/* Ventas hechas sin señal: se guardan en el celular con su hora y ubicación, y se envían solas al volver la señal. */
const COLA = {
  leer(k) { try { return JSON.parse(store.get(k) || '[]'); } catch (e) { return []; } },
  get pend() { return this.leer('diamante_cola'); }, set pend(v) { store.set('diamante_cola', JSON.stringify(v)); },
  get mal() { return this.leer('diamante_cola_mal'); }, set mal(v) { store.set('diamante_cola_mal', JSON.stringify(v)); },
  enviando: false,
};
async function enviarCola() {
  if (COLA.enviando || !S.token || !COLA.pend.length) return;
  COLA.enviando = true; let n = 0;
  try {
    while (COLA.pend.length) {
      const it = COLA.pend[0];
      try { await call('apiVenta', S.token, it.datos); n++; }
      catch (e) { if (e.offline) break; COLA.mal = COLA.mal.concat([Object.assign({}, it, { error: e.message })]); }
      COLA.pend = COLA.pend.slice(1);
    }
  } finally { COLA.enviando = false; }
  if (n) { toast(n === 1 ? 'Se envió 1 venta que estaba guardada en el celular' : 'Se enviaron ' + n + ' ventas guardadas en el celular'); await cargar(true); render(); }
  else if (COLA.mal.length && S.vista === 'inicio') render();
}
window.addEventListener('online', () => enviarCola());
setInterval(() => { if (navigator.onLine) enviarCola(); }, 60000);
function colaHTML() {
  const p = COLA.pend, m = COLA.mal;
  if (!p.length && !m.length) return '';
  return `<div class="card" style="gap:8px">${p.length ? `<div class="warnbox">${p.length} venta(s) guardadas en el celular sin señal. Se envían solas cuando haya internet.</div><button class="btn sec small" data-act="enviarCola">Enviar ahora</button>` : ''}
    ${m.map((x, i) => `<div class="badbox">No se pudo guardar la venta a ${esc(nice(x.nombre))} (${money(x.total)}): ${esc(x.error)}<br><button class="btn sec small" style="margin-top:6px" data-act="descartarMal" data-i="${i}">Ya la registré de nuevo · quitar</button></div>`).join('')}</div>`;
}

async function run(fn, args, msg) {
  loading(true, msg);

  catch (e) { toast(e.message, true); throw e; }
  finally { loading(false); }
}

    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === '⌫' ? 'Borrar' : k}">${k}</button>`).join('')}</div>
    <button class="btn" id="entrar" style="max-width:236px">Entrar</button></div>`;
  const dots = () => { $('#dots').innerHTML = Array.from({length: Math.max(4, pin.length)}, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  dots();
  const entrar = async () => {
    if (pin.length < 4) return toast('Escribe tu PIN completo', true);
    try {
      const r = await run('apiLogin', [pin], 'Entrando…');
      S.token = r.token; S.user = r.user; store.set('diamante_token', r.token); store.set('diamante_user', JSON.stringify(r.user));

  $('#entrar').onclick = entrar;
  document.onkeydown = e => { if (!$('.pinpad')) return; if (/^\d$/.test(e.key)) { pin += e.key; dots(); if (pin.length === 6) entrar(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); dots(); } else if (e.key === 'Enter') entrar(); };

/* ============ avisos: campana, sonido, vibración y alerta ============ */
const AV = { lista: [], noLeidos: 0, visto: new Set(), timer: null, audio: null, primera: true };
const ICON_CAMPANA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
function campanaHTML() { return `<button class="bell ${AV.noLeidos ? 'hay' : ''}" data-go="avisos" aria-label="Avisos${AV.noLeidos ? ': ' + AV.noLeidos + ' sin ver' : ''}">${ICON_CAMPANA}${AV.noLeidos ? `<span class="cnt">${AV.noLeidos}</span>` : ''}</button>`; }
function pintarCampana() { document.querySelectorAll('.bell').forEach(b => { b.outerHTML = campanaHTML(); }); document.title = (AV.noLeidos ? '(' + AV.noLeidos + ') ' : '') + 'El Diamante'; }
function prepararAudio() { try { if (!AV.audio) AV.audio = new (window.AudioContext || window.webkitAudioContext)(); if (AV.audio.state === 'suspended') AV.audio.resume(); } catch (e) {} }
function sonar(urgente) {
  try {
    prepararAudio(); const ctx = AV.audio; if (!ctx) return;
    const notas = urgente ? [988, 740, 988, 740, 988] : [880, 1175, 1568];
    notas.forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      const t = ctx.currentTime + i * (urgente ? .22 : .16); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + .18); o.start(t); o.stop(t + .2); });
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(urgente ? [300, 120, 300, 120, 500] : [200, 100, 200]); } catch (e) {}
}
function mostrarAlerta(a) {
  let el = document.getElementById('alerta'); if (el) el.remove();
  el = document.createElement('button'); el.id = 'alerta'; el.className = 'alerta' + (a.tipo === 'URGENTE' || a.tipo === 'PROBLEMA' ? '' : ' info');
  el.innerHTML = `<span class="ico">${ICON_CAMPANA}</span><span style="flex:1;min-width:0"><small>${a.tipo === 'URGENTE' ? 'AVISO URGENTE' : 'Aviso nuevo'} · ${esc(nice(a.de))}</small><b>${esc(a.mensaje.length > 90 ? a.mensaje.slice(0, 90) + '…' : a.mensaje)}</b></span><span class="x" role="button" aria-label="Cerrar aviso">✕</span>`;
  el.onclick = ev => { el.remove(); if (!ev.target.closest('.x')) ir('avisos'); };
  document.body.appendChild(el);
}
async function revisarAvisos() {
  if (!S.token) return;
  try {
    const r = await call('apiAvisos', S.token);
    const nuevos = r.avisos.filter(a => !a.leido && !AV.visto.has(a.id));
    AV.lista = r.avisos; AV.noLeidos = r.noLeidos;
    r.avisos.forEach(a => AV.visto.add(a.id));
    pintarCampana();
    if (nuevos.some(a => a.de === 'PEDIDOS')) { S.ruta = null; if (S.vista === 'ruta') render(); }
    if (nuevos.length && !AV.primera) { const u = nuevos.find(a => a.tipo === 'URGENTE') || nuevos[0]; sonar(u.tipo === 'URGENTE'); mostrarAlerta(u); }
    else if (AV.primera && r.noLeidos) { mostrarAlerta(r.ultimoNoLeido); }
    AV.primera = false;
    if (S.vista === 'avisos' && !$('#avMsg:focus')) render();
  } catch (e) {}
}
function iniciarAvisos() {
  clearInterval(AV.timer); AV.primera = true; AV.visto = new Set();
  revisarAvisos();
  AV.timer = setInterval(() => { if (document.visibilityState === 'visible') revisarAvisos(); }, 30000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token) revisarAvisos(); });
document.addEventListener('pointerdown', prepararAudio, { once: false, passive: true });

function marco(titulo, sub, cuerpo, conAtras) {
  return `<header class="top">${conAtras ? '<button class="back" data-act="atras" aria-label="Regresar">‹</button>' : `<div class="logo img"><img src="${LOGO_DIA}" alt="El Diamante"></div>`}
    <div class="ttl"><h2>${esc(titulo)}</h2>${sub ? `<small>${esc(sub)}</small>` : ''}</div>

}
function renderNav() {

  const items = rol === 'RUTA' ? [['inicio', 'Inicio', ICON.home], ['ruta', 'Ruta', ICON.ruta]]

  $('#navInner').innerHTML = items.map(([v, t, i]) => `<button data-nav="${v}" ${act === v ? 'aria-current="page"' : ''}>${i}${t}${v === 'pedidos' && S.data && S.data.pedidos.length ? ` (${S.data.pedidos.length})` : ''}</button>`).join('');

}

function render() {

  $('#app').className = 'app' + (S.vista === 'panel' ? ' wide' : '');

VISTAS.clientes.despues = () => {
  const b = $('#buscar');
  b.oninput = () => { S.params.q = b.value; const q = b.value.toLowerCase(); $('#lista').innerHTML = listaClientesHTML(S.data.clientes.filter(c => c.id !== S.data.idPlanta && c.id !== S.data.idPaso && c.nombre.toLowerCase().indexOf(q) >= 0)); };
};
function listaClientesHTML(lista) {
  return lista.map(c => `<button class="row" data-go="cliente" data-id="${c.id}"><div class="who"><b>${esc(nice(c.nombre))}</b>
    <small>${c.ultima ? 'Última compra hace ' + c.diasDesde + ' días' : 'Sin compras'}${c.frecuencia ? ' · compra cada ' + c.frecuencia + ' días' : ''} · ${money(c.precios.GARRAFON)}</small></div>
    ${c.estatus === 'INACTIVO' ? '<span class="pill p-bad">Inactivo</span>' : c.saldo > 0.5 ? `<span class="pill p-warn">Debe ${money(c.saldo)}</span>` : ''}</button>`).join('') || '<p class="muted">Sin resultados.</p>';
}

VISTAS.cliente = (p) => {
  const c = cliente(p.id);
  if (!c) return marco('Cliente', '', '<p>No encontrado.</p>', true);
  const liga = S.data.linkPedidos + '&c=' + encodeURIComponent(c.codigoPedido);
  return marco(nice(c.nombre), c.id + (c.telefono ? ' · ' + c.telefono : ''), `
    <div class="kp"><div><span>Saldo</span><b>${money(c.saldo)}</b></div><div><span>Última compra</span><b>${c.ultima ? fmtDia(c.ultima) : '—'}</b><small class="muted">${c.diasDesde != null ? 'hace ' + c.diasDesde + ' días' : ''}</small></div>
    <div><span>Compra cada</span><b>${c.frecuencia ? c.frecuencia + ' días' : '—'}</b></div><div><span>Suele pedir</span><b>${c.promGarrafon} garr.</b><small class="muted">${c.promGalon ? c.promGalon + ' galones' : ''}</small></div></div>
    <div class="card"><div class="lbl">Sus precios</div>${['GARRAFON', 'GALON', 'BOTELLA 1 LT', 'BOTELLA 1/2 LT'].map(k => `<div class="tot"><span>${nice(k)}</span><b>${money(c.precios[k])}</b></div>`).join('')}</div>
    <div class="card" style="gap:8px"><div class="tot"><span class="lbl" style="margin:0">Límite de fiado</span><b>${money(c.limite)}</b></div>
      ${esDueno() ? `<div class="btnrow"><input class="inp" id="limCli" inputmode="numeric" placeholder="${c.limite}" style="flex:1;min-width:0"><button class="btn sec small" data-act="guardarLimite" data-id="${c.id}">Cambiar</button></div><small class="muted">El repartidor no puede fiarle más de esto. Déjalo vacío para usar el general.</small>` : `<small class="muted">No se le puede fiar más de esto.</small>`}</div>
    <div class="grid2"><button class="big" data-go="venta" data-id="${c.id}">${ICON.venta}Vender</button><button class="big alt" data-go="cobro" data-id="${c.id}">${ICON.cobro}Cobrar</button></div>
    ${c.direccion ? `<p class="muted" style="margin:0">${esc(c.direccion)}</p>` : ''}
    <div class="btnrow">
      ${c.ubicacion ? `<a class="btn sec small" style="text-decoration:none" target="_blank" href="https:\/\/www.google.com/maps/dir/?api=1&destination=${c.ubicacion.lat},${c.ubicacion.lon}">Cómo llegar</a>` : '<span class="pill p-warn">Sin ubicación guardada</span>'}
      ${c.telefono ? `<a class="btn sec small" style="text-decoration:none" target="_blank" href="${wa(c.telefono, 'Hola, para pedir tu agua El Diamante solo abre esta liga: ' + liga)}">Mandar liga de pedidos</a>` : ''}
      ${c.telefono && c.saldo > 0.5 ? `<a class="btn sec small" style="text-decoration:none" target="_blank" href="${wa(c.telefono, 'Hola, te recordamos tu saldo pendiente con Purificadora El Diamante: ' + money(c.saldo) + '. Aquí ves tus compras y pagos: ' + S.data.linkCuenta + encodeURIComponent(c.codigoPedido) + ' ¡Gracias!')}">Recordar saldo</a>` : ''}
      <a class="btn sec small" style="text-decoration:none" target="_blank" href="${S.data.linkCuenta + encodeURIComponent(c.codigoPedido)}">Estado de cuenta</a>
      ${c.telefono ? `<a class="btn sec small" style="text-decoration:none" target="_blank" href="${wa(c.telefono, 'Hola, este es tu estado de cuenta con Purificadora El Diamante (compras, pagos y saldo): ' + S.data.linkCuenta + encodeURIComponent(c.codigoPedido))}">Mandar estado de cuenta</a>` : ''}
    </div>`, true);
};

VISTAS.venta = (p) => {
  const c = cliente(p.id);
  if (!c) return marco('Venta', '', '<p>Cliente no encontrado.</p>', true);
  const esPlanta = c.id === S.data.idPlanta;
  const esPaso = c.id === S.data.idPaso;
  const ped = p.pedido ? S.data.pedidos.find(x => x.id === p.pedido) : null;
  S.venta = S.venta && S.venta.cliente === c.id ? S.venta : { cliente: c.id, q: {}, precio: {}, metodo: 'EFECTIVO' };
  if (ped && !S.venta.desdePedido) { S.venta.q.GARRAFON = ped.garrafones; S.venta.q.GALON = ped.galones; S.venta.desdePedido = true; }
  const prods = S.data.productos.filter(x => esPlanta ? true : x.id !== 'HIELO');
  const v = S.venta;
  const precio = k => (v.precio[k] !== undefined && v.precio[k] !== '' ? Number(v.precio[k]) : c.precios[k]);
  const total = prods.reduce((s, x) => s + (v.q[x.id] || 0) * precio(x.id), 0);
  if ((esPlanta || esPaso) && v.metodo === 'CREDITO') v.metodo = 'EFECTIVO';
  return marco(esPlanta ? 'Venta en planta' : esPaso ? 'Cliente de paso' : nice(c.nombre), esPlanta ? 'Mostrador' : esPaso ? 'Persona que no está en tu lista · precio de lista' : c.id + (c.saldo > 0.5 ? ' · debe ' + money(c.saldo) : ''), `
    ${esPaso ? `<div class="card" style="gap:10px"><label class="f">Nombre o negocio (opcional)<input class="inp" id="pasoNombre" value="${esc(v.pasoNombre || '')}" placeholder="Ej. Señora de la esquina"></label>
      <label class="f">Teléfono (opcional)<input class="inp" id="pasoTel" inputmode="tel" value="${esc(v.pasoTel || '')}"></label>
      <small class="muted">Si va a comprar seguido, mejor <button class="btn sec small" style="padding:4px 10px" data-go="nuevoCliente">dalo de alta como cliente</button></small></div>` : ''}
    ${ped ? `<div class="okbox">Pedido: ${ped.garrafones} garrafones${ped.galones ? ' y ' + ped.galones + ' galones' : ''}${ped.notas ? ' · ' + esc(ped.notas) : ''}</div>` : ''}
    <div class="card"><div class="lbl">Productos</div>
      ${prods.map(x => `<div class="step"><div><b>${esc(nice(x.nombre))}</b><br><small class="muted">${esDueno() ? `<input class="inp" style="width:90px;padding:4px 8px;font-size:14px" inputmode="decimal" data-precio="${x.id}" value="${precio(x.id)}" aria-label="Precio ${esc(x.nombre)}">` : money(precio(x.id)) + ' c/u'}</small></div>
        <div class="ctl"><button data-q="${x.id}" data-d="-1" aria-label="Menos">−</button><input inputmode="numeric" data-qi="${x.id}" value="${v.q[x.id] || 0}" aria-label="Cantidad ${esc(x.nombre)}"><button data-q="${x.id}" data-d="1" aria-label="Más">+</button></div></div>`).join('')}
    </div>
    <div class="card"><div class="lbl">Cómo paga</div>
      <div class="seg">${[['EFECTIVO', 'Efectivo'], ['TRANSFERENCIA', 'Transferencia'], ['CREDITO', 'Fiado']].filter(([k]) => !(k === 'CREDITO' && (esPlanta || esPaso))).map(([k, t]) => `<button data-metodo="${k}" aria-pressed="${v.metodo === k}">${t}</button>`).join('')}</div>
      ${v.metodo === 'CREDITO' && c.saldo > 0.5 ? `<div class="warnbox">Ya debe ${money(c.saldo)}. Con esta venta quedaría en ${money(c.saldo + total)}.</div>` : ''}
      ${v.metodo === 'CREDITO' && !esDueno() && c.saldo + total > c.limite + 0.01 ? `<div class="badbox">Pasa su límite de fiado (${money(c.limite)}). Cobra en efectivo o pide a Oscar que suba el límite.</div>` : ''}
      ${v.metodo === 'TRANSFERENCIA' && !esDueno() ? '<small class="muted">Oscar confirmará que la transferencia llegó. Si no llega, se te cuenta como efectivo.</small>' : ''}
      ${v.metodo === 'CREDITO' && esPlanta ? '<div class="badbox">No se puede fiar en mostrador. Elige el cliente.</div>' : ''}
    </div>
    ${!esPlanta && S.user.rol === 'RUTA' && !(S.data.carga && S.data.carga.registrada) ? '<div class="badbox">No hay salida registrada hoy. Pide a planta que registre la salida antes de vender.</div>' : ''}
    ${esPlanta ? '' : `<div class="card" style="gap:6px"><div class="tot"><span class="lbl" style="margin:0">Ubicación y hora</span><span class="pill ${UB.pos ? 'p-ok' : 'p-warn'}" id="ubPill">${UB.pos ? 'Lista' : (UB.err ? 'Sin ubicación' : 'Buscando…')}</span></div>
      <small class="muted" id="ubTxt">${UB.pos ? 'Precisión ±' + UB.pos.precision + ' m · ' + horaAhora() : esc(UB.err || 'Buscando tu ubicación…')}</small>
      ${S.data.carga && S.data.carga.registrada ? `<small class="muted">En la camioneta: ${S.data.carga.garrafones} garrafones · ${S.data.carga.galones} galones</small>` : ''}
      ${S.data.carga && S.data.carga.registrada && (v.q.GARRAFON || 0) > S.data.carga.garrafones ? `<div class="warnbox">Solo traes ${S.data.carga.garrafones} garrafones según la salida registrada.</div>` : ''}
      <small class="muted">La venta se registra donde estás. Regístrala frente al cliente.</small></div>`}
    <div class="tot"><span class="muted">Total</span><strong id="total">${money(total)}</strong></div>
    <button class="btn" data-act="guardarVenta" ${total <= 0 && !(v.q.GALONCAMB > 0) ? 'disabled' : ''}>Guardar venta</button>`, true);
};
VISTAS.venta.despues = () => {
  ['pasoNombre', 'pasoTel'].forEach(k => { const i = document.getElementById(k); if (i) i.oninput = () => { S.venta[k] = i.value; }; });
  const c = cliente(S.params.id);
  if (c && c.id !== S.data.idPlanta && (!UB.pos || Date.now() - UB.t > 60000)) {
    pedirUbicacion(60000).then(() => {}, () => {}).then(() => {
      const t = $('#ubTxt'), p = $('#ubPill'); if (!t || !p) return;
      t.textContent = UB.pos ? 'Precisión ±' + UB.pos.precision + ' m · ' + horaAhora() : (UB.err || '');
      p.textContent = UB.pos ? 'Lista' : 'Sin ubicación'; p.className = 'pill ' + (UB.pos ? 'p-ok' : 'p-bad');
    });
  }
  document.querySelectorAll('[data-qi]').forEach(i => i.onchange = () => { S.venta.q[i.dataset.qi] = Math.max(0, parseInt(i.value, 10) || 0); render(); });
  document.querySelectorAll('[data-precio]').forEach(i => i.onchange = () => { S.venta.precio[i.dataset.precio] = i.value; render(); });
};

VISTAS.elegir = (p) => {
  const q = (p.q || '').toLowerCase();
  return marco('Venta rápida', '¿A quién le vendes?', `
    <button class="row" data-go="venta" data-id="${S.data.idPaso}" style="border-color:var(--agua)"><div class="who"><b>Cliente de paso</b><small>Alguien que no está en tu lista y sale a pedir agua</small></div><span class="pill p-info">Rápido</span></button>
    <button class="row" data-go="nuevoCliente"><div class="who"><b>+ Cliente nuevo</b><small>Darlo de alta y venderle</small></div></button>
    <div class="search"><input class="inp" id="buscarV" placeholder="Buscar cliente registrado…" value="${esc(p.q || '')}" autocomplete="off"></div>
    <div id="listaV">${listaElegir(q)}</div>`, true);
};
function listaElegir(q) {
  const l = S.data.clientes.filter(c => c.id !== S.data.idPlanta && c.id !== S.data.idPaso && c.estatus !== 'INACTIVO' && (!q || c.nombre.toLowerCase().indexOf(q) >= 0));
  return l.slice(0, 40).map(c => `<button class="row" data-go="venta" data-id="${c.id}"><div class="who"><b>${esc(nice(c.nombre))}</b><small>${money(c.precios.GARRAFON)} el garrafón${c.ultima ? ' · compró hace ' + c.diasDesde + ' días' : ''}</small></div>${c.saldo > 0.5 ? `<span class="pill p-warn">Debe ${money(c.saldo)}</span>` : ''}</button>`).join('') || '<p class="muted">Sin resultados. Usa “Cliente de paso” o da de alta uno nuevo.</p>';
}
VISTAS.elegir.despues = () => { const b = $('#buscarV'); b.oninput = () => { S.params.q = b.value; $('#listaV').innerHTML = listaElegir(b.value.toLowerCase()); }; };

const PLANTILLAS = [
  ['SOLICITUD', 'Faltan tapas'], ['SOLICITUD', 'Faltan garrafones vacíos'], ['SOLICITUD', 'Faltan etiquetas / sellos'],
  ['PROBLEMA', 'Se ponchó la moto'], ['PROBLEMA', 'Falla en la planta'], ['PROBLEMA', 'Cliente molesto'],
  ['SOLICITUD', 'Cliente pide agua'], ['INDICACION', 'Indicación'], ['URGENTE', 'Urgente'],
];
const TIPOS = { SOLICITUD: 'Solicitud', PROBLEMA: 'Problema', INDICACION: 'Indicación', URGENTE: 'Urgente' };
const PARA = { TODOS: 'Todos', DUENO: 'Dueño', RUTA: 'Ruta', PLANTA: 'Planta' };
const hace = t => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min'; const h = Math.round(m / 60); if (h < 24) return 'hace ' + h + ' h'; return 'hace ' + Math.round(h / 24) + ' d'; };
VISTAS.avisos = () => {
  S.nuevoAviso = S.nuevoAviso || { tipo: 'SOLICITUD', para: 'TODOS', msg: '' };
  const n = S.nuevoAviso;
  const abiertos = AV.lista.filter(a => a.estatus !== 'ATENDIDO'), cerrados = AV.lista.filter(a => a.estatus === 'ATENDIDO');
  const card = a => `<div class="aviso ${a.tipo} ${a.estatus} ${a.leido ? '' : 'nuevo'}">
    <div class="meta"><span class="pill t-${a.tipo}">${TIPOS[a.tipo] || a.tipo}</span><b style="color:var(--ink)">${esc(nice(a.de))}</b><span>→ ${PARA[a.para] || nice(a.para)}</span><span>· ${hace(a.cuando)}</span>${a.leido ? '' : '<span class="pill p-info">Nuevo</span>'}</div>
    <p>${esc(a.mensaje)}</p>
    <div class="meta">${a.leidoPor.length ? 'Visto por ' + a.leidoPor.map(x => esc(nice(x))).join(', ') : 'Nadie lo ha visto todavía'}${a.estatus === 'ATENDIDO' ? ' · <span class="pill p-ok">Resuelto por ' + esc(nice(a.atendio)) + '</span>' : ''}</div>
    ${a.estatus !== 'ATENDIDO' ? `<div class="btnrow">${a.leido ? '' : `<button class="btn sec small" data-act="avisoLeido" data-id="${a.id}">Enterado</button>`}<button class="btn small" data-act="avisoAtendido" data-id="${a.id}">Ya quedó resuelto</button></div>` : ''}</div>`;
  return marco('Avisos', AV.noLeidos ? AV.noLeidos + ' sin ver' : 'Comunicación del equipo', `
    <div class="card"><div class="lbl" style="margin:0">Mandar aviso</div>
      <div class="plantillas">${PLANTILLAS.map(([t, x]) => `<button class="chip" data-plantilla="${esc(x)}" data-tipo="${t}">${esc(x)}</button>`).join('')}</div>
      <textarea class="inp" id="avMsg" rows="3" style="min-height:84px;font:15px/1.5 var(--body)" placeholder="Ej. En planta se acabaron las tapas Ciel, traer 1,000">${esc(n.msg)}</textarea>
      <div class="lbl" style="margin:0">Tipo</div>
      <div class="seg">${Object.keys(TIPOS).map(k => `<button data-avtipo="${k}" aria-pressed="${n.tipo === k}">${TIPOS[k]}</button>`).join('')}</div>
      <div class="lbl" style="margin:0">Para</div>
      <div class="seg">${Object.keys(PARA).map(k => `<button data-avpara="${k}" aria-pressed="${n.para === k}">${PARA[k]}</button>`).join('')}</div>
      ${n.tipo === 'URGENTE' ? '<small class="muted">Los urgentes también le llegan al dueño por correo.</small>' : ''}
      <button class="btn" data-act="enviarAviso">Enviar aviso</button></div>
    ${abiertos.length ? `<div class="lbl">Pendientes</div>${abiertos.map(card).join('')}` : '<div class="okbox">No hay avisos pendientes.</div>'}
    ${cerrados.length ? `<div class="lbl">Resueltos (últimos 4 días)</div>${cerrados.map(card).join('')}` : ''}`, true);
};
VISTAS.avisos.despues = () => {
  const t = $('#avMsg'); if (t) t.oninput = () => { S.nuevoAviso.msg = t.value; };
  const al = document.getElementById('alerta'); if (al) al.remove();
  const sinVer = AV.lista.filter(a => !a.leido).map(a => a.id);
  if (sinVer.length) setTimeout(() => { if (S.vista === 'avisos') call('apiAvisoLeido', S.token, sinVer).then(revisarAvisos).catch(() => {}); }, 2500);
};

VISTAS.cobroLista = () => {
  const lista = S.data.clientes.filter(c => c.saldo > 0.5).sort((a, b) => b.saldo - a.saldo);
  return marco('Cobrar fiado', lista.length + ' clientes deben', lista.map(c => `<button class="row" data-go="cobro" data-id="${c.id}"><div class="who"><b>${esc(nice(c.nombre))}</b><small>Última compra hace ${c.diasDesde} días</small></div><span class="pill p-warn">${money(c.saldo)}</span></button>`).join('') || '<div class="okbox">Nadie debe.</div>', true);
};

VISTAS.cobro = (p) => {
  const c = cliente(p.id);
  S.cobro = S.cobro && S.cobro.id === p.id ? S.cobro : { id: p.id, metodo: 'EFECTIVO', monto: '' };
  return marco('Registrar abono', nice(c.nombre), `
    <div class="card"><div class="tot"><span class="muted">Saldo actual</span><strong>${money(c.saldo)}</strong></div></div>
    <div class="card"><label class="f">Monto que paga<input class="inp" id="monto" inputmode="decimal" value="${esc(S.cobro.monto)}" placeholder="0"></label>
      <div class="seg">${[['EFECTIVO', 'Efectivo'], ['TRANSFERENCIA', 'Transferencia']].map(([k, t]) => `<button data-cmetodo="${k}" aria-pressed="${S.cobro.metodo === k}">${t}</button>`).join('')}</div>
      <label class="f">Nota (opcional)<input class="inp" id="notaAbono" placeholder="Ej. pagó con billete de 500"></label>
      ${esDueno() ? `<label class="f">Fecha<input class="inp" type="date" id="fechaAbono" value="${S.data.hoy || ''}" max="${S.data.hoy || ''}"></label>` : ''}</div>
    <button class="btn" data-act="guardarAbono">Guardar abono</button>
    ${c.saldo > 0.5 ? `<button class="btn sec" data-act="liquidar">Paga todo (${money(c.saldo)})</button>` : ''}`, true);
};
VISTAS.cobro.despues = () => { $('#monto').oninput = e => { S.cobro.monto = e.target.value; }; };

VISTAS.gasto = () => {
  S.gasto = S.gasto || { tipo: 'GASTO', metodo: 'EFECTIVO' };
  const g = S.gasto;
  const opciones = g.tipo === 'GASTO' ? S.data.categoriasGasto : S.data.insumos;
  return marco('Gasto o compra', 'Todo el dinero que sale', `
    <div class="seg"><button data-gtipo="GASTO" aria-pressed="${g.tipo === 'GASTO'}">Gasto</button><button data-gtipo="COMPRA" aria-pressed="${g.tipo === 'COMPRA'}">Compra de insumo</button></div>
    <div class="card">
      <label class="f">${g.tipo === 'GASTO' ? 'Categoría' : 'Insumo'}<select class="inp" id="gConcepto"><option value="">Elige…</option>${opciones.map(o => `<option>${esc(o)}</option>`).join('')}</select></label>
      ${g.tipo === 'COMPRA' ? '<label class="f">Cantidad (piezas)<input class="inp" id="gCant" inputmode="numeric" placeholder="Ej. 1000"></label>' : ''}
      <label class="f">Total pagado<input class="inp" id="gTotal" inputmode="decimal" placeholder="$0"></label>
      <div class="seg"><button data-gmetodo="EFECTIVO" aria-pressed="${g.metodo === 'EFECTIVO'}">Efectivo</button><button data-gmetodo="TRANSFERENCIA" aria-pressed="${g.metodo === 'TRANSFERENCIA'}">Transferencia</button></div>
      <label class="f">Nota (opcional)<input class="inp" id="gNota" placeholder="Ej. gasolina camioneta blanca"></label>
      ${esDueno() ? `<label class="f">Fecha<input class="inp" type="date" id="gFecha" value="${S.data.hoy || ''}" max="${S.data.hoy || ''}"></label>` : ''}
    </div>
    <button class="btn" data-act="guardarGasto">Guardar</button>
    <p class="muted" style="margin:0;font-size:13px">Las compras de insumos (tapas, galones, botellas, garrafones nuevos) se guardan en COMPRAS para llevar el inventario.</p>`, true);
};

VISTAS.salida = (p) => {
  const modo = (p && p.modo) || '';
  const sal = S.data.salidasHoy;
  const ok = S.okSal && Date.now() - S.okSal.t < 120000 ? S.okSal : null;
  const pend = sal.find(s => !s.regreso);
  const sel = S.regSel && sal.find(s => s.id === S.regSel) ? S.regSel : (pend ? pend.id : (sal.length ? sal[sal.length - 1].id : ''));
  const act = sal.find(s => s.id === sel);
  const rv = k => act && act.regreso ? act.regreso[k] : '';
  return marco(modo === 'salida' ? 'Salida a ruta' : modo === 'regreso' ? 'Regreso a planta' : 'Salida y regreso', 'Control de garrafones', `
    ${ok && ok.alerta ? `<div class="badbox" style="font-size:15px">${esc(ok.alerta)}</div>` : ''}${ok && ok.cuadra ? '<div class="okbox">Los garrafones de hoy cuadran.</div>' : ''}
    ${ok ? `<div class="card okbox" style="border:2px solid var(--ok);text-align:center"><b style="font-size:19px">✓ ${esc(ok.titulo)}</b><div style="font-size:14px;margin-top:4px">${esc(ok.txt)}</div></div>` : ''}
    <div class="card"><h3>Guardado hoy</h3>
      ${sal.length ? sal.map(s => `<div style="padding:9px 0;border-top:1px solid rgba(255,255,255,.08)">

/* ============ panel del dueño ============ */
function rangoPeriodo(k) {
  const hoy = S.data.hoy; const [y, m] = hoy.split('-').map(Number);
  const dow = new Date(y, m - 1, Number(hoy.slice(8))).getDay() || 7;
  if (k === 'hoy') return [hoy, hoy];
  if (k === 'ayer') return [addDays(hoy, -1), addDays(hoy, -1)];
  if (k === 'semana') return [addDays(hoy, 1 - dow), hoy];
  if (k === 'mes') return [hoy.slice(0, 8) + '01', hoy];
  if (k === 'mesPasado') { const d = new Date(y, m - 2, 1), e = new Date(y, m - 1, 0); const f = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); return [f(d), f(e)]; }
  return [S.panel.desde || hoy, S.panel.hasta || hoy];
}
async function cargarPanel() {
  const [a, b] = rangoPeriodo(S.panel.periodo);
  S.panel.desde = a; S.panel.hasta = b;
  try { S.panel.data = await run('apiPanel', [S.token, a, b], 'Armando tu panel…'); render(); } catch (e) {}
}
const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
const delta = (a, b) => { const p = pct(a, b); return p == null ? '' : `<small style="color:var(--${p >= 0 ? 'ok' : 'bad'})">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}% vs periodo anterior</small>`; };

VISTAS.panel = () => {
  if (!esDueno()) return marco('Mi panel', '', '<div class="badbox">Solo el dueño puede ver esto.</div>');
  const P = S.panel, r = P.data;
  if (!r) { setTimeout(cargarPanel, 0); return marco('Mi panel', '', '<p class="muted">Cargando…</p>'); }
  const per = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', 'Esta semana'], ['mes', 'Este mes'], ['mesPasado', 'Mes pasado'], ['rango', 'Elegir fechas']];
  const tabs = [['resumen', 'Resumen'], ['recorrido', 'Recorrido'], ['clientes', 'Clientes'], ['ventas', 'Ventas'], ['gastos', 'Gastos'], ['cortes', 'Cortes'], ['actividad', 'Actividad'], ['reporte', 'Reporte para enviar']];
  let cuerpo = '';
  if (P.tab === 'resumen') cuerpo = panelResumen(r);
  if (P.tab === 'clientes') cuerpo = panelClientes(r);
  if (P.tab === 'recorrido') cuerpo = panelRecorrido(r);
  if (P.tab === 'ventas') cuerpo = tabla(['Día', 'Cliente', 'Producto', 'Cant.', 'Precio', 'Total', 'Pago', ''], r.ventasDetalle.map(v => [fmtDia(v.dia), nice(v.cliente), nice(v.producto), v.cantidad, money(v.precio), money(v.total), nice(v.metodo), `<span><button class="btn sec small" style="padding:3px 9px" data-act="borrarVenta" data-id="${esc(v.id)}" data-desc="${esc(v.cantidad + ' ' + nice(v.producto) + ' a ' + nice(v.cliente) + ' por ' + money(v.total))}">Borrar</button></span>`]), [3, 4, 5]) + (r.ventasDetalle.length >= 300 ? '<p class="muted">Se muestran las últimas 300 ventas del periodo.</p>' : '');
  if (P.tab === 'gastos') cuerpo = `<div class="card">${r.gastosPorCategoria.map(g => hbar(nice(g.categoria), g.total, r.gastosPorCategoria[0].total)).join('') || '<p class="muted">Sin gastos en el periodo.</p>'}</div>` + tabla(['Día', 'Concepto', 'Total', 'Pago'], r.gastosDetalle.map(g => [fmtDia(g.dia), nice(g.concepto), money(g.total), nice(g.metodo)]), [2]);
  if (P.tab === 'cortes') cuerpo = tabla(['Día', 'Esperado', 'Entregado', 'Diferencia'], r.cortes.map(c => [fmtDia(c.dia), money(c.esperado), money(c.entregado), `<span class="pill ${Math.abs(c.diferencia) < 1 ? 'p-ok' : 'p-bad'}">${money(c.diferencia)}</span>`]), [1, 2, 3]) + '<p class="muted">Solo aparecen los cortes con efectivo entregado capturado.</p>';
  if (P.tab === 'actividad') cuerpo = tabla(['Cuándo', 'Quién', 'Qué', 'Detalle'], r.actividad.map(a => [a.cuando, nice(a.usuario), nice(a.accion), esc(a.detalle).slice(0, 140)])) + `<div class="card"><h3>Usuarios</h3>${r.usuarios.map(u => `<div class="tot"><span>${esc(nice(u.nombre))}</span><span class="pill ${u.activo ? 'p-ok' : 'p-bad'}">${u.rol}${u.activo ? '' : ' · inactivo'}</span></div>`).join('')}<p class="muted" style="margin:0;font-size:13px">Los PIN se cambian o se desactivan en la hoja USUARIOS_APP.</p></div>`;
  if (P.tab === 'reporte') cuerpo = panelReporte(r);
  return marco('Mi panel', 'Del ' + fmtDia(r.desde) + ' al ' + fmtDia(r.hasta) + ' · solo tú lo ves', `
    <div class="chips">${per.map(([k, t]) => `<button class="chip" data-periodo="${k}" aria-pressed="${P.periodo === k}">${t}</button>`).join('')}</div>
    ${P.periodo === 'rango' ? `<div class="btnrow"><input type="date" class="inp" style="width:auto" id="pDesde" value="${P.desde}"><input type="date" class="inp" style="width:auto" id="pHasta" value="${P.hasta}"><button class="btn small" data-act="rango">Ver</button></div>` : ''}
    <div class="chips">${tabs.map(([k, t]) => `<button class="chip" data-tab="${k}" aria-pressed="${P.tab === k}">${t}</button>`).join('')}</div>
    ${cuerpo}`);
};

function tabla(h, filas, nums) {
  nums = nums || [];
  return `<div class="tw" style="max-height:70vh"><table><tr>${h.map((x, i) => `<th class="${nums.indexOf(i) >= 0 ? 'n' : ''}">${x}</th>`).join('')}</tr>${filas.map(f => `<tr>${f.map((x, i) => `<td class="${nums.indexOf(i) >= 0 ? 'n' : ''}">${typeof x === 'string' && x.indexOf('<span') === 0 ? x : esc(x)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${h.length}" class="muted">Sin datos en este periodo.</td></tr>`}</table></div>`;
}
function hbar(t, v, max) { return `<div class="hbar"><span>${esc(t)}</span><i style="width:${max ? Math.max(3, v / max * 100) : 0}%"></i><b style="font-variant-numeric:tabular-nums">${money(v)}</b></div>`; }

function graficaDias(r) {
  const d = r.porDia; if (!d.length) return '';
  const W = 640, H = 200, pl = 44, pb = 22, pt = 12, max = Math.max(1, ...d.map(x => x.ventas));
  const top = Math.ceil(max / 1000) * 1000 || 1000;
  const bw = (W - pl - 8) / d.length;
  let s = '';
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); s += `<line x1="${pl}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 3}" text-anchor="end">${money(top * f)}</text>`; });
  d.forEach((x, i) => {
    const h = (H - pt - pb) * x.ventas / top, X = pl + i * bw + bw * .15;
    s += `<rect x="${X}" y="${H - pb - h}" width="${bw * .7}" height="${h}" rx="2" fill="var(--agua)"><title>${fmtDia(x.dia)}: ${money(x.ventas)} · ${x.garrafones} garrafones</title></rect>`;
    const cada = Math.ceil(d.length / 10);
    if (i % cada === 0) s += `<text x="${X + bw * .35}" y="${H - 6}" text-anchor="middle">${fmtDia(x.dia)}</text>`;
  });
  return `<div class="card chart"><h3>Ventas por día</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día">${s}</svg></div>`;
}

function panelRecorrido(r) {
  const R = r.recorrido || [];
  const pts = R.filter(x => x.lat != null);
  const lejos = R.filter(x => x.distancia != null && x.distancia > r.distanciaAlerta);
  const sin = R.filter(x => x.lat == null);
  const links = [];
  for (let i = 0; i < pts.length; i += 10) { const ch = pts.slice(i, i + 10); links.push(`<a class="btn sec small" style="text-decoration:none" target="_blank" href="https:\/\/www.google.com/maps/dir/${ch.map(p => p.lat + ',' + p.lon).join('/')}">Ver recorrido en Maps${pts.length > 10 ? ' (' + (i + 1) + '–' + (i + ch.length) + ')' : ''}</a>`); }
  const dist = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m';
  return `<div class="pgrid">
    <div class="card"><span class="muted">Ventas en ruta</span><b style="font:700 26px var(--mono)">${R.length}</b></div>
    <div class="card"><span class="muted">Lejos del cliente (más de ${r.distanciaAlerta} m)</span><b style="font:700 26px var(--mono);color:var(--${lejos.length ? 'bad' : 'ok'})">${lejos.length}</b></div>
    <div class="card"><span class="muted">Sin ubicación</span><b style="font:700 26px var(--mono);color:var(--${sin.length ? 'warn' : 'ok'})">${sin.length}</b></div></div>
    ${r.dias > 1 ? '<p class="muted" style="margin:0">Elige “Hoy” o “Ayer” arriba para ver el recorrido de un solo día en orden.</p>' : ''}
    ${links.length ? `<div class="btnrow">${links.join('')}</div>` : ''}
    ${tabla(['Día', 'Hora', 'Quién', 'Cliente', 'Garr.', 'Total', 'Dónde', ''], R.slice().reverse().map(x => [fmtDia(x.dia), x.hora, nice(x.usuario), nice(x.cliente), x.garrafones, money(x.total),
      x.lat == null ? '<span class="pill p-warn">Sin ubicación</span>' : x.distancia == null ? '<span class="pill p-info">Cliente sin ubicación guardada</span>' : `<span class="pill ${x.distancia > r.distanciaAlerta ? 'p-bad' : 'p-ok'}">${x.distancia > r.distanciaAlerta ? 'A ' + dist(x.distancia) + ' del cliente' : 'En el cliente (' + dist(x.distancia) + ')'}</span>`,
      x.lat == null ? '' : `<span><a class="btn sec small" style="text-decoration:none;padding:3px 9px" target="_blank" href="https:\/\/www.google.com/maps?q=${x.lat},${x.lon}">Ver</a></span>`]), [4, 5])}
    <p class="muted" style="margin:0;font-size:13px">Las ventas anteriores a esta versión no tienen ubicación. Desde hoy cada venta en ruta guarda dónde y a qué hora se hizo.</p>`;
}

function panelClientes(r) {
  return `<div class="card"><h3>Te deben ${money(r.porCobrar)}</h3>${r.deudores.map(d => `<div class="tot" style="flex-wrap:wrap"><span>${esc(nice(d.nombre))}${d.estatus === 'INACTIVO' ? ' <span class="pill p-bad">Inactivo</span>' : ''} <small class="muted">· última compra hace ${d.diasDesde} días</small></span>
    <span class="btnrow"><b>${money(d.saldo)}</b>${d.telefono ? `<a class="btn sec small" style="text-decoration:none;padding:4px 10px" target="_blank" href="${wa(d.telefono, 'Hola, te recordamos tu saldo pendiente con Purificadora El Diamante: ' + money(d.saldo) + '. ¡Gracias!')}">Recordar</a>` : ''}</span></div>`).join('')}</div>
  ${tabla(['Cliente', 'Precio', 'Saldo', 'Última', 'Días', 'Compra cada', 'Suele pedir', 'Estatus'], r.clientes.sort((a, b) => (a.diasDesde == null) - (b.diasDesde == null) || a.diasDesde - b.diasDesde).map(c => [nice(c.nombre), money(c.precio), money(c.saldo), fmtDia(c.ultima), c.diasDesde == null ? '—' : c.diasDesde, c.frecuencia ? c.frecuencia + ' días' : '—', c.promGarrafon + ' garr.' + (c.promGalon ? ' · ' + c.promGalon + ' gal.' : ''), nice(c.estatus)]), [1, 2, 4])}`;
}

function textoReporte(r) {
  const m = money, h = r.hoy;
  const L = [];
  L.push('*' + S.data.negocio + '*');
  L.push('Periodo: ' + fmtDia(r.desde) + (r.desde !== r.hasta ? ' al ' + fmtDia(r.hasta) : ''));
  L.push('');
  L.push('*Ventas:* ' + m(r.ventas) + (pct(r.ventas, r.ventasAnterior) != null ? ' (' + (pct(r.ventas, r.ventasAnterior) >= 0 ? '+' : '') + pct(r.ventas, r.ventasAnterior) + '% vs periodo anterior)' : ''));
  L.push('• Garrafones: ' + r.garrafones + ' · Galones: ' + r.galones);
  L.push('• Precio promedio garrafón: ' + m(r.precioPromedio));
  L.push('• Efectivo: ' + m(r.efectivo) + ' · Transferencia: ' + m(r.transferencia) + ' · Fiado: ' + m(r.credito));
  L.push('• Cobros de fiado: ' + m(r.abonos));
  L.push('• Mostrador: ' + m(r.ventasPlanta));
  L.push('');
  L.push('*Salidas de dinero:*');
  L.push('• Gastos: ' + m(r.gastos) + ' · Compras de insumos: ' + m(r.compras) + ' · Comisiones: ' + m(r.comisiones));
  r.gastosPorCategoria.slice(0, 6).forEach(g => L.push('   - ' + nice(g.categoria) + ': ' + m(g.total)));
  L.push('');
  L.push('*Utilidad estimada:* ' + m(r.utilidad));
  L.push('*Diferencias de corte:* ' + m(r.diferenciasCorte) + ' en ' + r.cortes.length + ' cortes');
  L.push('*Por cobrar:* ' + m(r.porCobrar));
  r.deudores.slice(0, 5).forEach(d => L.push('   - ' + nice(d.nombre) + ': ' + m(d.saldo)));
  if (r.bajaron.length) { L.push(''); L.push('*Compraron menos:* ' + r.bajaron.slice(0, 5).map(b => nice(b.nombre)).join(', ')); }
  if (r.hasta === S.data.hoy) { L.push(''); L.push('*Hoy:* efectivo esperado ' + m(h.esperado) + ' · salieron ' + h.salieron + ' garrafones, regresaron llenos ' + h.regresaronLlenos + ', rotos ' + h.rotos); }
  L.push('Pedidos pendientes: ' + r.pedidos.length);
  return L.join('\n');
}
function panelReporte(r) {

/* ============ mini mapa (mosaico de OpenStreetMap + trazo propio) ============ */
function miniMapa(grupos, planta, opts) {
  opts = opts || {};
  const W = 640, H = 320, pad = 26;
  const calor = (opts.calor || []).filter(p => p && isFinite(p.lat) && isFinite(p.lon));
  const pts = [planta].concat(...grupos.map(g => g.puntos), calor).filter(p => p && isFinite(p.lat) && isFinite(p.lon));
  if (pts.length < 2) return `<div class="mapa" style="display:grid;place-items:center"><small class="muted">${opts.vacio || 'Sin puntos para mostrar'}</small></div>`;
  const wx = (lon, z) => (lon + 180) / 360 * 256 * Math.pow(2, z);
  const wy = (lat, z) => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * Math.pow(2, z); };
  let z = 16;
  for (; z > 9; z--) {
    const xs = pts.map(p => wx(p.lon, z)), ys = pts.map(p => wy(p.lat, z));
    if (Math.max(...xs) - Math.min(...xs) <= W - 2 * pad && Math.max(...ys) - Math.min(...ys) <= H - 2 * pad) break;
  }
  const xs = pts.map(p => wx(p.lon, z)), ys = pts.map(p => wy(p.lat, z));
  const x0 = (Math.max(...xs) + Math.min(...xs)) / 2 - W / 2, y0 = (Math.max(...ys) + Math.min(...ys)) / 2 - H / 2;
  const X = p => (wx(p.lon, z) - x0).toFixed(1), Y = p => (wy(p.lat, z) - y0).toFixed(1);
  let tiles = '';
  for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + W) / 256); tx++) for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + H) / 256); ty++) {
    tiles += `<img alt="" loading="lazy" onerror="this.style.visibility='hidden'" src="https:\/\/tile.openstreetmap.org/${z}/${tx}/${ty}.png" style="left:${((tx * 256 - x0) / W * 100).toFixed(3)}%;top:${((ty * 256 - y0) / H * 100).toFixed(3)}%;width:${(256 / W * 100).toFixed(3)}%;height:${(256 / H * 100).toFixed(3)}%">`;
  }
  let svg = '';
  if (calor.length) {
    const col = w => w > .6 ? 'cr' : w > .3 ? 'ca' : 'cb';
    svg += `<defs>${[['cr', '#ff3d6e'], ['ca', '#ffb800'], ['cb', '#00c8ff']].map(([k, c]) => `<radialGradient id="${k}"><stop offset="0" stop-color="${c}" stop-opacity=".85"/><stop offset=".45" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')}</defs><g class="calor">`
      + calor.slice().sort((a, b) => a.peso - b.peso).map(p => `<circle cx="${X(p)}" cy="${Y(p)}" r="${(16 + 46 * p.peso).toFixed(1)}" fill="url(#${col(p.peso)})"/>`).join('') + '</g>';
  }
  grupos.forEach(g => {
    const ruta = g.cerrar ? [planta].concat(g.puntos, [planta]) : g.desdePlanta ? [planta].concat(g.puntos) : g.puntos;
    if (ruta.length > 1 && !g.sinLinea) svg += `<polyline points="${ruta.map(p => X(p) + ',' + Y(p)).join(' ')}" fill="none" stroke="${g.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".85" ${g.punteado ? 'stroke-dasharray="6 6"' : ''}/>`;
  });
  grupos.forEach(g => g.puntos.forEach((p, i) => {
    const r = p.grande ? 11 : 9;
    svg += `<g opacity="${p.tenue ? .45 : 1}"><circle cx="${X(p)}" cy="${Y(p)}" r="${r}" fill="#03080c" stroke="${g.color}" stroke-width="2.5"/><text x="${X(p)}" y="${(+Y(p) + 3.8).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">${p.etiqueta != null ? p.etiqueta : i + 1}</text></g>`;
  }));
  svg += `<g><rect x="${X(planta) - 9}" y="${Y(planta) - 9}" width="18" height="18" rx="4" transform="rotate(45 ${X(planta)} ${Y(planta)})" fill="#00d2ff" stroke="#fff" stroke-width="1.5"/><text x="${X(planta)}" y="${(+Y(planta) + 3.8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="#02121b" font-family="system-ui,sans-serif">P</text></g>`;
  const ley = grupos.filter(g => g.nombre).map(g => `<span style="color:${g.color}">${esc(g.nombre)}</span>`).join('');
  return `<div class="mapa" role="img" aria-label="${esc(opts.alt || 'Mapa de la ruta')}"><div class="tiles">${tiles}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${svg}</svg>${ley ? `<div class="ley">${ley}</div>` : ''}<span class="attr">© OpenStreetMap</span></div>`;
}
const COLORES_VIAJE = ['#00c8ff', '#ff4fd8', '#7cff6b', '#ffb800'];
function mapaViajes(R, soloPendientes, verComprados) {
  const P = R.planta || (S.ruta && S.ruta.planta);
  const grupos = R.viajes.map((t, k) => ({ nombre: 'Viaje ' + (k + 1), color: COLORES_VIAJE[k % 4], cerrar: true,
    puntos: t.paradas.map((p, i) => ({ lat: p.lat, lon: p.lon, tenue: p.visitado, etiqueta: i + 1, visto: p.visitado })).filter(p => !soloPendientes || !p.visto) }));
  if (soloPendientes && verComprados) {
    const ya = [].concat(...R.viajes.map(t => t.paradas.filter(p => p.visitado)));
    if (ya.length) grupos.push({ nombre: 'Ya compraron', color: '#3dffa8', sinLinea: true, puntos: ya.map(p => ({ lat: p.lat, lon: p.lon, etiqueta: '✓' })) });
  }

}

VISTAS.agendaHecho = (p) => {

  const cats = S.data.categoriasGasto;
  const act = String(a.actividad).toUpperCase();
  const sugerida = /FILTRO|QUIMIC|CLORO|RESINA|MEMBRANA/.test(act) ? 'FILTROS Y QUIMICOS' : /FUMIG|LIMPIEZA/.test(act) ? 'LIMPIEZA' : a.tipo === 'MANTENIMIENTO' ? 'REPARACIONES'

      <label class="f">Registrarlo como gasto en<select class="inp" id="ahCat"><option value="">No registrar gasto</option>${cats.map(c => `<option ${c === sugerida ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>

};

/* ============ separador ============ */
VISTAS.separador = () => {
  if (!esDueno()) return marco('Separador', '', '<div class="badbox">Solo el dueño puede ver esto.</div>', true);
  S.sep = S.sep || { modo: 'hoy', dia: S.data.hoy, data: null };
  const P = S.sep, r = P.data;
  if (!r) { setTimeout(async () => { try { const rango = P.modo === 'mes' ? [S.data.hoy.slice(0, 8) + '01', S.data.hoy] : [P.dia, P.dia]; P.data = await run('apiSeparador', [S.token, rango[0], rango[1]], 'Calculando…'); render(); } catch (e) {} }, 0); return marco('Separador del día', 'Calculando…', '<p class="muted">Calculando…</p>', true); }
  const max = Math.max(1, ...r.sobres.map(x => x.total));
  return marco('Separador del día', r.desde === r.hasta ? fechaLarga(r.desde) : 'Del ' + fmtDiaLargo(r.desde) + ' al ' + fmtDiaLargo(r.hasta), `
    <div class="chips"><button class="chip" data-sepmodo="hoy" aria-pressed="${P.modo === 'hoy'}">Un día</button><button class="chip" data-sepmodo="mes" aria-pressed="${P.modo === 'mes'}">Este mes</button></div>
    ${P.modo === 'hoy' ? `<label class="f">Día<input class="inp" type="date" id="sepDia" value="${P.dia}" max="${S.data.hoy}"></label>` : ''}
    <div class="kp"><div><span>Entró de dinero</span><b>${money(r.entro)}</b><small class="muted">Efectivo ${money(r.efectivo)} · Transf. ${money(r.transferencia)} · Cobros ${money(r.abonos)}</small></div>
      <div><span>Separar en total</span><b>${money(r.totalSobres)}</b><small class="muted">${r.garrafones} garrafones · ${r.galones} galones${r.fiado ? ' · fiado ' + money(r.fiado) + ' (aún no entra)' : ''}</small></div></div>
    <div class="card" style="gap:10px"><div class="lbl" style="margin:0">Separa así</div>
      ${r.sobres.map(x => `<div style="display:flex;flex-direction:column;gap:4px"><div class="tot"><span>${esc(x.concepto)}</span><strong style="font-variant-numeric:tabular-nums">${money(Math.round(x.total))}</strong></div><div class="hbar" style="margin:0"><i style="width:${Math.max(2, x.total / max * 100)}%"></i></div><small class="muted">${esc(x.detalle)}${x.nota ? ' · ' + esc(x.nota) : ''}</small></div>`).join('')}
    </div>
    <div class="${r.queda >= 0 ? 'okbox' : 'badbox'}" style="font-size:15px">${r.queda >= 0 ? 'Te queda (tu ganancia): ' + money(Math.round(r.queda)) : 'Faltaron ' + money(Math.round(-r.queda)) + ' para cubrir todos los sobres'}</div>
    <p class="muted" style="margin:0;font-size:13px">Los montos por día salen de tus gastos del mes entre 26 días de trabajo. Si algo cambia (sube la renta, otro sueldo), cámbialo en la hoja SEPARADOR de tu Google Sheet y aquí se actualiza solo.</p>`, true);
};

/* ============ ticket después de vender o cobrar ============ */
const ICON_WA = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2z"/></svg>';
