/* ============ Cuadre del negocio (solo dueño) ============ */
function rangoControl() {
  const C = S.control, hoy = S.data.hoy;
  const menos = n => { const [y, m, d] = hoy.split('-').map(Number); const x = new Date(y, m - 1, d - n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  if (C.periodo === 'hoy') return [hoy, hoy];
  if (C.periodo === 'semana') return [menos(6), hoy];
  if (C.periodo === 'mes') return [menos(29), hoy];
  return [C.desde || menos(6), C.hasta || hoy];
}
/* El garrafón se llena según qué tan bien cuadra el negocio: lleno = sin fugas. */
function garrafonNivel(score, tono) {
  const top = 34, bottom = 142, y = Math.round(bottom - (bottom - top) * Math.max(0.04, score / 100));
  return `<svg class="gn gn-${tono}" viewBox="0 0 120 150" role="img" aria-label="Nivel de control ${score} de 100">
    <defs><clipPath id="gnc"><path d="M30 34h60q10 0 10 12v86q0 10-10 10H30q-10 0-10-10V46q0-12 10-12z"/></clipPath></defs>
    <rect class="gn-cap" x="44" y="6" width="32" height="12" rx="3"/><path class="gn-neck" d="M48 18h24v8q0 4 6 8H42q6-4 6-8z"/>
    <g clip-path="url(#gnc)"><g class="gn-agua"><path d="M-40 ${y} q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 V160 H-40z"/></g></g>
    <path class="gn-body" d="M30 34h60q10 0 10 12v86q0 10-10 10H30q-10 0-10-10V46q0-12 10-12z"/>
    <path class="gn-rib" d="M20 70h80M20 104h80"/>
    <text x="60" y="98" text-anchor="middle">${score}</text></svg>`;
}
function nivelBar(etq, pct, malo, detalle) {
  return `<div class="nv ${malo ? 'nv-mal' : ''}"><div class="nv-t"><span>${etq}</span><b>${pct}%</b></div><div class="nv-b"><i style="width:${Math.max(2, Math.min(100, pct))}%"></i></div>${detalle ? `<small>${detalle}</small>` : ''}</div>`;
}
VISTAS.control = () => {
  S.control = S.control || { periodo: 'semana', data: null, desde: '', hasta: '' };
  const C = S.control;
  const chips = `<div class="chips">${[['hoy', 'Hoy'], ['semana', '7 días'], ['mes', '30 días'], ['rango', 'Fechas']].map(([k, t]) => `<button class="chip" data-cper="${k}" aria-pressed="${C.periodo === k}">${t}</button>`).join('')}</div>
    ${C.periodo === 'rango' ? `<div class="btnrow"><input class="inp" type="date" id="cDesde" value="${C.desde}" style="flex:1" aria-label="Desde"><input class="inp" type="date" id="cHasta" value="${C.hasta}" style="flex:1" aria-label="Hasta"><button class="btn small" data-act="ctlRango">Ver</button></div>` : ''}`;
  if (!C.data) {
    const [de, a] = rangoControl();
    setTimeout(async () => { try { C.data = await run('apiControl', [S.token, de, a], 'Revisando el negocio…'); S.data.porConfirmar = C.data.pendientes.length; render(); } catch (e) {} }, 0);
    return marco('Cuadre del negocio', 'Revisando…', chips + '<p class="muted">Cargando…</p>', true);
  }
  const r = C.data, pct = (a, b) => (b ? Math.round(a * 100 / b) : 0);
  const n = { alta: 0, media: 0, baja: 0 }; r.alertas.forEach(a => n[a.nivel]++);
  const score = Math.max(4, 100 - n.alta * 14 - n.media * 6 - n.baja * 2);
  const tono = score >= 80 ? 'ok' : score >= 50 ? 'warn' : 'bad';
  const veredicto = { ok: 'Todo cuadra', warn: 'Hay detalles por revisar', bad: 'Hay cosas que no cuadran' }[tono];
  const hero = `<section class="ctl-hero ctl-${tono}">${garrafonNivel(score, tono)}
    <div class="ctl-v"><h3>${veredicto}</h3><p class="muted">Del ${fmtDiaLargo(r.desde)} al ${fmtDiaLargo(r.hasta)}. El garrafón se llena cuando todo cuadra.</p>
      <div class="ctl-n"><span class="c-bad"><b>${n.alta}</b> graves</span><span class="c-warn"><b>${n.media}</b> por revisar</span><span class="c-low"><b>${n.baja}</b> menores</span></div></div></section>`;
  const pend = r.pendientes.length ? `<section class="card ctl-pend"><h3><i class="pulso"></i>${r.pendientes.length === 1 ? 'Una transferencia' : r.pendientes.length + ' transferencias'} por confirmar</h3><p class="muted" style="margin:0">Revisa tu banco y marca cada una.</p>
      ${r.pendientes.map(p => `<div class="pend"><div class="tot"><b class="pend-m">${money(p.monto)}</b><small class="muted">${fmtDiaLargo(p.dia)}</small></div>
        <div>${esc(nice(p.cliente))} <span class="muted">· ${p.tipo === 'VENTA' ? 'venta' : 'abono'} de ${esc(nice(p.registro))}</span></div>
        <div class="btnrow"><button class="btn small" data-act="verificar" data-id="${p.id}" data-accion="OK">Sí llegó</button>
        <button class="btn sec small" data-act="verificar" data-id="${p.id}" data-accion="FIADO">${p.tipo === 'VENTA' ? 'No llegó, pasar a fiado' : 'No llegó, anular abono'}</button>
        <button class="btn sec small" data-act="verificar" data-id="${p.id}" data-accion="REPARTIDOR">No llegó, que lo entregue ${esc(nice(p.registro))}</button></div></div>`).join('')}</section>` : '';
  const alertas = `<section class="card"><h3>Qué revisar</h3>${r.alertas.length ? `<ul class="al">${r.alertas.map(a => `<li class="al-${a.nivel}">${esc(a.texto)}</li>`).join('')}</ul>` : '<div class="okbox">Todo cuadra en este periodo.</div>'}</section>`;
  const trab = r.trabajadores.map(t => {
    const tot = t.efectivo + t.credito + t.transferencia;
    const chipsT = [[t.fuera, 'lejos del cliente'], [t.enPlanta, 'en la planta'], [t.rafaga, 'capturadas de golpe'], [t.cambiosGalon, 'cambios de galón']].filter(x => x[0]).map(x => `<span class="tchip"><b>${x[0]}</b> ${x[1]}</span>`).join('');
    return `<section class="card trab"><div class="trab-h"><span class="ava">${esc(nice(t.nombre).charAt(0))}</span><div><h3>${esc(nice(t.nombre))}</h3><small class="muted">${t.ventas} ventas, ${money(tot)}</small></div></div>
      ${t.ruta ? nivelBar('Registradas frente al cliente', pct(t.enCliente, t.ruta), pct(t.enCliente, t.ruta) < 60, t.enCliente + ' de ' + t.ruta + ' ventas en ruta') + nivelBar('Con ticket al cliente', pct(t.tickets, t.ruta), pct(t.tickets, t.ruta) < 50, t.tickets + ' tickets mandados') : ''}
      ${tot && (t.ruta || t.credito) ? nivelBar('Vendido a fiado', pct(t.credito, tot), pct(t.credito, tot) >= 25, money(t.credito) + (t.transferencia ? ' · transferencias ' + money(t.transferencia) : '')) : ''}
      ${chipsT ? `<div class="tchips">${chipsT}</div>` : ''}</section>`;
  }).join('');
  const maxS = Math.max(1, ...r.cuadre.map(d => Math.max(d.salieron, d.vendidos + d.llenos + d.rotos)));
  const cuadre = r.cuadre.length ? `<section class="card"><h3>Garrafones por día</h3><p class="muted" style="margin:0">Lo que salió contra lo vendido y lo que regresó lleno.</p>
    <div class="cq">${r.cuadre.map(d => {
      const w = x => (x / maxS * 100).toFixed(1) + '%';
      const est = d.sinSalida ? ['bad', 'sin salida'] : d.sinRegreso ? ['warn', d.sinRegreso + ' sin regreso'] : Math.abs(d.diferencia) <= 2 ? ['ok', 'cuadra'] : ['bad', d.diferencia > 0 ? 'faltan ' + d.diferencia : 'sobran ' + (-d.diferencia)];
      return `<div class="cq-r"><span class="cq-d">${fmtDia(d.dia)}</span><div class="cq-b"><i class="cq-s" style="width:${w(d.salieron)}"></i><i class="cq-v" style="width:${w(d.vendidos)}"></i><i class="cq-l" style="left:${w(d.vendidos)};width:${w(d.llenos + d.rotos)}"></i></div><span class="pill p-${est[0]}">${est[1]}</span></div>`;
    }).join('')}</div>
    <div class="cq-ley"><span><i class="cq-s"></i>Salieron</span><span><i class="cq-v"></i>Vendidos</span><span><i class="cq-l"></i>Regresaron</span></div></section>` : '';
  const perdido = r.bajoPrecio.reduce((s, b) => s + b.perdido, 0);
  const bajo = r.bajoPrecio.length ? `<section class="card"><h3>Cobrado abajo del precio</h3><p class="muted" style="margin:0">${money(perdido)} menos en el periodo. Con esta versión el precio lo pone la app, así que de aquí en adelante debe quedar vacío.</p>
    ${r.bajoPrecio.map(b => `<div class="bp"><div><b>${esc(nice(b.cliente))}</b><small class="muted">${b.cantidad} ${nice(b.producto).toLowerCase()} a ${money(b.cobrado)}, precio vigente ${money(b.vigente)}</small></div><b class="bp-m">−${money(b.perdido)}</b></div>`).join('')}</section>` : '';
  const cortes = r.cortes.length ? `<section class="card"><h3>Cortes de efectivo</h3>${r.cortes.map(c => `<div class="bp"><div><b>${fmtDiaLargo(c.dia)}</b><small class="muted">Entregó ${money(c.entregado)} de ${money(c.esperado)}</small></div><span class="pill ${Math.abs(c.diferencia) < 1 ? 'p-ok' : 'p-bad'}">${Math.abs(c.diferencia) < 1 ? 'cuadra' : (c.diferencia < 0 ? 'faltan ' : 'sobran ') + money(Math.abs(c.diferencia))}</span></div>`).join('')}</section>` : '';
  const ratio = r.garrafonesVendidos ? Math.min(100, r.tapas / r.garrafonesVendidos * 100) : 0;
  const tapas = `<section class="card"><h3>Tapas contra garrafones</h3>
    <div class="tp"><div><b>${r.garrafonesVendidos}</b><small class="muted">garrafones vendidos</small></div><div><b>${r.tapas}</b><small class="muted">tapas compradas</small></div></div>
    <div class="nv-b"><i style="width:${ratio}%"></i></div>
    <small class="muted">Cada garrafón lleva una tapa. Registra todas las compras de tapas en "Gasto o compra": si con el tiempo se gastan más tapas que garrafones vendidos, hay agua saliendo sin registrar.</small></section>`;
  const aj = r.ajustes.length ? `<section class="card"><h3>Deudas canceladas con ajuste</h3><p class="muted" style="margin:0">Pagos que nunca se registraron y se dieron por buenos.</p>${r.ajustes.map(a => `<div class="bp"><div><b>${esc(nice(a.cliente))}</b><small class="muted">${fmtDiaLargo(a.dia)}</small></div><b class="bp-m">${money(a.monto)}</b></div>`).join('')}</section>` : '';
  const cam = r.cambios.length ? `<section class="card"><h3>Cambios delicados</h3>${r.cambios.map(c => `<div class="bp"><div><b>${esc(nice(c.accion))}</b><small class="muted">${esc(c.detalle)}</small></div><small class="muted" style="text-align:right">${esc(c.cuando)}<br>${esc(nice(c.quien))}</small></div>`).join('')}</section>` : '';
  return marco('Cuadre del negocio', 'Del ' + fmtDia(r.desde) + ' al ' + fmtDia(r.hasta), `${chips}${hero}${pend}${alertas}${trab}${cuadre}${bajo}${cortes}${tapas}${aj}${cam}`, true);
};

/* ============ notificaciones (solo en la app instalable) ============ */
const PUSH = { soporta: !EN_GAS && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window, on: false, prefs: null, err: '' };
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const instalada = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function b64aBytes(s) { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function subPush() { const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function revisarPush() {
  if (!PUSH.soporta || !S.token) return;
  try {
    const sub = Notification.permission === 'granted' ? await subPush() : null;

  const H = S.hist, hoy = S.data.hoy;

/* ============ panel gráfico ============ */
function areaDias(d) {
  if (!d.length) return '';
  const W = 600, H = 150, pt = 14, pb = 20, max = Math.max(1, ...d.map(x => x.ventas));
  const x = i => d.length === 1 ? W / 2 : 6 + i * (W - 12) / (d.length - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  const pts = d.map((p, i) => [x(i), y(p.ventas)]);
  let ln = 'M' + pts[0].join(',');
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; ln += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const area = ln + ` L${pts[pts.length - 1][0]},${H - pb} L${pts[0][0]},${H - pb} Z`;
  const im = d.reduce((m, p, i) => p.ventas > d[m].ventas ? i : m, 0);
  return `<svg class="area" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c8ff" stop-opacity=".45"/><stop offset="1" stop-color="#00c8ff" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/><path d="${ln}" fill="none" stroke="#00c8ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${pts[im][0]}" cy="${pts[im][1]}" r="5" fill="#04070b" stroke="#00c8ff" stroke-width="3"/>
    <text x="${Math.min(W - 60, Math.max(60, pts[im][0]))}" y="${Math.max(12, pts[im][1] - 10)}" text-anchor="middle" class="a-max">${money(d[im].ventas)}</text>
    <text x="6" y="${H - 4}" class="a-d">${fmtDia(d[0].dia)}</text><text x="${W - 6}" y="${H - 4}" text-anchor="end" class="a-d">${fmtDia(d[d.length - 1].dia)}</text></svg>`;
}
function dona(partes, centro, sub) {
  const tot = partes.reduce((s, p) => s + Math.max(0, p.v), 0) || 1, R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcos = partes.filter(p => p.v > 0).map(p => { const l = p.v / tot * C; const s = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += l; return s; }).join('');
  return `<div class="dona"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(sub)}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--soft)" stroke-width="18"/>${arcos}<text x="70" y="68" text-anchor="middle" class="d-n">${centro}</text><text x="70" y="86" text-anchor="middle" class="d-s">${esc(sub)}</text></svg>
    <ul>${partes.map(p => `<li><i style="background:${p.c}"></i><span>${p.t}</span><b>${Math.round(Math.max(0, p.v) / tot * 100)}%</b></li>`).join('')}</ul></div>`;
}
function barraApilada(partes) {

    <div class="ba-l">${partes.map(p => `<span><i style="background:${p.c}"></i>${p.t} <b>${Math.round(p.v / tot * 100)}%</b></span>`).join('')}</div>`;

  const r = R.data;

    <small class="muted">Cobró ${money(g.efectivo)} en efectivo${g.abonos ? ' más ' + money(g.abonos) + ' de abonos' : ''} y dejó ${money(g.fiado)} en fiado. Si se paga del efectivo, te entrega <b style="color:var(--ink)">${money(g.entrega)}</b>.</small>
    ${g.conGps ? `<small class="${g.lejos ? 'mal' : 'bien'}">${g.lejos ? g.lejos + ' de ' + g.ventas + ' ventas registradas lejos del cliente' : 'Todas sus ventas se registraron frente al cliente'}.</small>` : ''}</section>`).join('');
  return marco('Ventas del día', fechaLarga(r.dia), `${chips}
    <section class="card rp-h"><small class="muted">Vendido</small><b class="rp-n">${money(Math.round(r.total))}</b><small class="muted">Fiado ${money(r.fiado)} · Transferencia ${money(r.transferencia)}</small></section>
    <section class="card"><h3>Efectivo de cada quien</h3><div class="rp-3">
      <div><b>${money(r.efectivo.PLANTA + r.abonos.PLANTA)}</b><small>Planta</small></div><div><b>${money(r.efectivo.RUTA + r.abonos.RUTA)}</b><small>Ruta</small></div><div><b>${money(r.efectivo.DUENO + r.abonos.DUENO)}</b><small>Tuyo</small></div></div>
      ${r.abonos.PLANTA + r.abonos.RUTA + r.abonos.DUENO ? '<small class="muted">Incluye los abonos de fiado cobrados en efectivo.</small>' : ''}</section>
    <div class="${r.duplicadas ? 'badbox' : 'okbox'}">${r.duplicadas ? r.duplicadas + (r.duplicadas === 1 ? ' venta parece repetida' : ' ventas parecen repetidas') + '. Revísalas abajo.' : '✓ Revisé las ' + r.ventas.length + ' ventas: no hay duplicadas.'}</div>
    <div class="hv-ley">${['GAEL', 'JESSICA', 'BLANCA', 'OSCAR'].map(n => `<span><i style="background:${COLOR_QUIEN(n)}"></i>${nice(n)}</span>`).join('')}</div>
    <section class="card" style="gap:0;padding:6px 14px">${filas || '<p class="muted">No hubo ventas este día.</p>'}</section>
    ${rep}
    <a class="btn sec" style="text-decoration:none;text-align:center" target="_blank" href="${wa('', textoDia(r))}">Mandar resumen por WhatsApp</a>`, true);
};

function textoDia(r) {
  const L = ['*Ventas del ' + fechaLarga(r.dia) + '*', 'Vendido: ' + money(r.total) + ' (fiado ' + money(r.fiado) + ')', '',
    '*Efectivo*', '• Planta: ' + money(r.efectivo.PLANTA + r.abonos.PLANTA), '• Ruta: ' + money(r.efectivo.RUTA + r.abonos.RUTA), '• Oscar: ' + money(r.efectivo.DUENO + r.abonos.DUENO)];

      const r = await run('apiSalida', [S.token, { garrafones: $('#sGarr').value, galones: $('#sGal').value, idSalida: S.salCorr || '' }], 'Guardando salida…');
      S.okSal = { t: Date.now(), titulo: r.corregida ? 'Salida corregida' : 'Salida guardada', txt: 'Viaje ' + r.ruta + ': ' + (+$('#sGarr').value || 0) + ' garrafones y ' + (+$('#sGal').value || 0) + ' galones' }; S.salCorr = null;
      S.regSel = null; toast('Salida del viaje ' + r.ruta + ' guardada'); await cargar(true); render(); window.scrollTo(0, 0);
    }
    else if (a === 'guardarRegreso') {
      const rg = { idSalida: $('#rSalida').value, vacios: $('#rVac').value, llenos: $('#rLlen').value, galones: $('#rGal').value, rotos: $('#rRot').value };
      if (['vacios', 'llenos', 'galones', 'rotos'].every(k => !String(rg[k]).trim())) return toast('Escribe cuántos regresaron (pon 0 donde no haya)', true);
      const rr = await run('apiRegreso', [S.token, rg], 'Guardando regreso…');
      S.okSal = { t: Date.now(), titulo: rr.corregido ? 'Regreso corregido y guardado' : 'Regreso guardado', txt: (+rg.vacios || 0) + ' vacíos · ' + (+rg.llenos || 0) + ' llenos · ' + (+rg.galones || 0) + ' galones · ' + (+rg.rotos || 0) + ' rotos' };
      const cq = rr.cuadre;
      if (cq) { const f = []; if (cq.faltanVacios > 2) f.push('Faltan ' + cq.faltanVacios + ' vacíos: se vendieron ' + cq.vendidos + ' y regresaron ' + cq.vacios + '.'); if (cq.faltanLlenos > 2) f.push('Faltan ' + cq.faltanLlenos + ' llenos que no se vendieron ni regresaron.');
        S.okSal.alerta = f.length ? f.join(' ') + ' Ya se le avisó a Oscar.' : ''; S.okSal.cuadra = !f.length; }
      S.regSel = null; toast(rr.corregido ? 'Regreso corregido' : 'Regreso guardado'); await cargar(true); render(); window.scrollTo(0, 0);
    }
    else if (a === 'guardarCorte') {
      const ent = $('#entregado').value;
      if (ent === '') return toast('Escribe el efectivo que se entrega', true);
      const r = await run('apiCorte', [S.token, { entregado: ent, nota: $('#notaCorte').value }], 'Cerrando corte…');
      toast(Math.abs(r.diferencia) < 1 ? 'Corte cerrado: cuadra' : 'Corte cerrado con diferencia de ' + money(r.diferencia), Math.abs(r.diferencia) >= 1);
      S.precorte = null; raiz('inicio');
    }
    else if (a === 'guardarCalidad') {
      await run('apiCalidad', [S.token, { punto: $('#qPunto').value, cloro: $('#qCloro').value, tds: $('#qTds').value, ph: $('#qPh').value }], 'Guardando…');
      toast('Lectura guardada'); atras();
    }
    else if (a === 'guardarCliente') {
      const data = { nombre: $('#ncNombre').value, telefono: $('#ncTel').value, direccion: $('#ncDir').value, ubicacion: $('#ncUb').value, precio: $('#ncPrecio') ? $('#ncPrecio').value : '', idPedido: d.pedido };
      const r = await run('apiNuevoCliente', [S.token, data], 'Guardando cliente…');
      toast('Cliente ' + r.id + ' guardado'); await cargar(true);
      if (d.pedido) { S.venta = null; S.historial.pop(); ir('venta', { id: r.id, pedido: d.pedido }, true); } else { S.historial.pop(); ir('cliente', { id: r.id }, true); }
    }
    else if (a === 'pedidoEstado') {
      await run('apiPedidoEstado', [S.token, d.id, d.estado], 'Actualizando…');
      toast(d.estado === 'CANCELADO' ? 'Pedido cancelado' : 'Pedido confirmado'); await cargar(true); S.ruta = null; render();
    }
    else if (a === 'enviarAviso') {
      const n = S.nuevoAviso; n.msg = $('#avMsg').value;
      if (!n.msg.trim()) return toast('Escribe el aviso', true);
      await run('apiAvisoNuevo', [S.token, { tipo: n.tipo, para: n.para, mensaje: n.msg }], 'Enviando…');
      toast('Aviso enviado'); S.nuevoAviso = null; await revisarAvisos(); render();
    }
    else if (a === 'avisoLeido') { await call('apiAvisoLeido', S.token, [d.id]); await revisarAvisos(); render(); }
    else if (a === 'avisoAtendido') { await run('apiAvisoAtendido', [S.token, d.id], 'Guardando…'); toast('Marcado como resuelto'); await revisarAvisos(); render(); }
    else if (a === 'borrarVenta') {
      if (S.confirmarBorrar !== d.id) { S.confirmarBorrar = d.id; b.textContent = '¿Seguro? Toca otra vez'; b.style.color = 'var(--bad)'; toast('Vas a borrar: ' + d.desc + '. Toca otra vez para confirmar.'); return; }
      S.confirmarBorrar = null;
      await run('apiBorrarVenta', [S.token, d.id], 'Borrando venta…');
      toast('Venta borrada'); S.panel.data = null; await cargar(true); render();
    }
    else if (a === 'entregarPedido') {
      const p = S.data.pedidos.find(x => x.id === d.id);
      S.venta = null;
      if (p.idCliente) ir('venta', { id: p.idCliente, pedido: p.id }); else ir('nuevoCliente', { pedido: p.id });
    }
  } catch (err) { /* el mensaje ya se mostró */ }
});

/* ============ arranque ============ */
window.__APP_OK__ = true;
try { const _a = document.getElementById('arranque'); if (_a) _a.remove(); } catch (e) {}
try {
  const vistaHash = (location.hash || '').slice(1);
  if (S.token) { cargar().then(() => { if (S.data) raiz(VISTAS[vistaHash] && vistaHash !== 'ticket' ? vistaHash : 'inicio'); else renderLogin(); }).catch(e => { __mostrarError(e.message || e); renderLogin(); }); } else renderLogin();
} catch (e) { __mostrarError('Arranque: ' + (e.message || e)); }
/* FIN-INDEX-V7 */
</script>
<div id="instalar" hidden style="position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;display:flex;gap:10px;align-items:center;background:#0a1017;border:1px solid rgba(0,200,255,.45);border-radius:14px;padding:10px 12px;box-shadow:0 0 18px rgba(0,200,255,.25)">
<img src="icons/icon-192.png" alt="" width="36" height="36" style="border-radius:8px"><span style="flex:1;font-size:14px">Instala El Diamante como app</span>
<button class="btn small" id="instalarSi" style="width:auto">Instalar</button><button class="btn sec small" id="instalarNo" style="width:auto">✕</button></div>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
let pedirInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedirInstalar = e; try { if (localStorage.getItem('diamante_no_instalar')) return; } catch (x) {} document.getElementById('instalar').hidden = false; });
document.getElementById('instalarSi').onclick = async () => { document.getElementById('instalar').hidden = true; if (pedirInstalar) { pedirInstalar.prompt(); pedirInstalar = null; } };
document.getElementById('instalarNo').onclick = () => { document.getElementById('instalar').hidden = true; try { localStorage.setItem('diamante_no_instalar', '1'); } catch (x) {} };
</script>
</body>
</html>
